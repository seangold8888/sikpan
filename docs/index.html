<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIKPAN 식판 — 가산 구내식당 오늘의 점심 점수</title>
<meta name="description" content="주판(ZOOPAN) 자매품. 서울 가산디지털단지 구내식당의 오늘 메뉴를 반찬까지 세어 점수로. Today's cafeteria menus in Seoul's Gasan Digital Complex, scored, in Korean and English.">
<meta property="og:title" content="SIKPAN 식판 · 주판(ZOOPAN) 자매품">
<meta property="og:description" content="반찬까지 세어서 점심을 고릅니다 · 가산디지털단지 구내식당 오늘의 메뉴와 점수">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23EF5A2F'/%3E%3Crect x='12' y='14' width='18' height='14' rx='4' fill='%23fff'/%3E%3Crect x='34' y='14' width='18' height='14' rx='4' fill='%23fff'/%3E%3Crect x='12' y='32' width='40' height='18' rx='5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  color-scheme:light;
  --bg:#F5F4F0; --card:#FFFFFF; --soft:#F2F0EB; --line:#E7E4DD; --line-2:#EFEDE8;
  --ink:#18181B; --ink-2:#54545C; --ink-3:#8B8B93;
  --accent:#EF5A2F; --accent-deep:#B83A12; --accent-wash:#FFEEE7;
  --good:#0E8A60; --good-wash:#E3F5EC; --warn:#9A5507; --warn-wash:#FDF1D6;
  --focus:#2F6BFF;
  --shadow:0 1px 2px rgba(20,20,24,.05),0 12px 32px -20px rgba(20,20,24,.22);
  --shadow-up:0 1px 2px rgba(20,20,24,.05),0 20px 44px -22px rgba(20,20,24,.32);
  --map-ground:#ECE9E2; --map-road:#FFFFFF; --map-case:#D8D3C9; --map-rail:#A39E94;
  --map-mall:#FBE4DA; --map-mall-line:#F0BCA7;
  --radius:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E0F11; --card:#17181B; --soft:#212226; --line:#2A2B30; --line-2:#222328;
  --ink:#F3F3F4; --ink-2:#B5B5BD; --ink-3:#7E7E88;
  --accent:#FF7A55; --accent-deep:#FFB39B; --accent-wash:#3A2019;
  --good:#34D399; --good-wash:#13342A; --warn:#FBBF24; --warn-wash:#3A2E12;
  --focus:#7AA2FF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px -22px rgba(0,0,0,.9);
  --shadow-up:0 1px 2px rgba(0,0,0,.4),0 22px 48px -22px rgba(0,0,0,1);
  --map-ground:#1B1D21; --map-road:#2B2E34; --map-case:#34373E; --map-rail:#6B6F78;
  --map-mall:#3A241D; --map-mall-line:#5A3326;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E0F11; --card:#17181B; --soft:#212226; --line:#2A2B30; --line-2:#222328;
  --ink:#F3F3F4; --ink-2:#B5B5BD; --ink-3:#7E7E88;
  --accent:#FF7A55; --accent-deep:#FFB39B; --accent-wash:#3A2019;
  --good:#34D399; --good-wash:#13342A; --warn:#FBBF24; --warn-wash:#3A2E12;
  --focus:#7AA2FF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px -22px rgba(0,0,0,.9);
  --shadow-up:0 1px 2px rgba(0,0,0,.4),0 22px 48px -22px rgba(0,0,0,1);
  --map-ground:#1B1D21; --map-road:#2B2E34; --map-case:#34373E; --map-rail:#6B6F78;
  --map-mall:#3A241D; --map-mall-line:#5A3326;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.5;
  word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%}
[hidden]{display:none!important}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 64px}

/* 머리 */
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:28px 0 16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:0 0 auto;display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--accent);font-size:22px;box-shadow:0 8px 20px -10px var(--accent)}
h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.06em;line-height:1.2}
.ttl{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}
.sib{padding:3px 8px;border:1px solid var(--line);border-radius:999px;color:var(--ink-3);font-size:11px;font-weight:700;line-height:1;white-space:nowrap}
.stamp{margin-top:3px;color:var(--ink-3);font-size:13px;font-weight:600}
.langs{flex:0 0 auto;display:flex;padding:3px;background:var(--soft);border-radius:11px}
.langs button{height:32px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--ink-3);font-size:13px;font-weight:700;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* 검색줄 */
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;margin:0 -20px 8px;padding:10px 20px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}
.search{position:relative;flex:1;min-width:0}
.search svg{position:absolute;left:15px;top:50%;width:18px;height:18px;color:var(--ink-3);transform:translateY(-50%);pointer-events:none}
.search input{width:100%;height:46px;padding:0 16px 0 44px;background:var(--card);border:1px solid var(--line);border-radius:14px;
  color:var(--ink);font:500 15px/1 "Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;box-shadow:var(--shadow);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--ink-3)}
.tbtn{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;height:46px;padding:0 16px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;color:var(--ink);font-size:14px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
.tbtn svg{width:17px;height:17px}
.tbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.count{flex:0 0 auto;min-width:40px;color:var(--ink-3);font-size:13px;font-weight:700;text-align:right;white-space:nowrap}

/* 공통 */
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 0 12px}
.sechead h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
.sechead .sub{color:var(--ink-3);font-size:13px;font-weight:600;text-align:right}
.banner{margin:10px 0 0;padding:12px 16px;border-radius:12px;background:var(--warn-wash);color:var(--warn);font-size:13.5px;font-weight:600;line-height:1.55}
.banner b{font-weight:800}
.linkbtn{padding:4px 0;border:0;background:none;color:var(--ink-2);font-size:13px;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}

/* 오늘의 추천 Top 3 */
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:16px 18px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);color:inherit;text-align:left;cursor:pointer;
  transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.pk:hover{transform:translateY(-2px);box-shadow:var(--shadow-up)}
.pk .rk{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--soft);color:var(--ink-2);font-size:15px;font-weight:800}
.pk:first-child{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.pk:first-child .rk{background:var(--accent);color:#fff}
.pkb{display:flex;flex-direction:column;min-width:0}
.pk .nm{overflow:hidden;font-size:16px;font-weight:800;letter-spacing:-.02em;text-overflow:ellipsis;white-space:nowrap}
.pk .ds{overflow:hidden;margin-top:2px;color:var(--ink-2);font-size:13px;text-overflow:ellipsis;white-space:nowrap}
.pk .mt{overflow:hidden;margin-top:3px;color:var(--ink-3);font-size:12px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
.pk .sc{font-size:26px;font-weight:800;letter-spacing:-.04em;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.pk:first-child .sc{color:var(--accent)}
.pk .sc small{display:block;margin-top:4px;color:var(--ink-3);font-size:10px;font-weight:700;letter-spacing:.06em}
.tunebar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 14px;margin-top:10px;color:var(--ink-3);font-size:13px}
.origin b{color:var(--ink);font-weight:800}
.origin .linkbtn{margin-left:6px}

/* 추천 기준 서랍 */
.tune{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:30px;margin-top:10px;padding:22px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.tune h3{margin:0 0 10px;color:var(--ink-3);font-size:12.5px;font-weight:800;letter-spacing:.02em}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.presets button{height:36px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink-2);font-size:13px;font-weight:700;cursor:pointer}
.presets button:hover{border-color:var(--ink-3)}
.presets button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.wrow{display:grid;grid-template-columns:84px minmax(0,1fr) 22px;align-items:center;gap:10px;min-height:34px}
.wrow label{color:var(--ink-2);font-size:13px;font-weight:700}
.cov{margin-left:5px;padding:1px 5px;border-radius:5px;background:var(--warn-wash);color:var(--warn);font-size:10px;font-weight:800}
input[type=range]{width:100%;accent-color:var(--accent)}
.wv{font-size:13px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.ate{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px;color:var(--ink-3);font-size:12px}
.ate button{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink-2);font-size:12px;font-weight:700;cursor:pointer}
.ate button:hover{border-color:var(--ink-3);color:var(--ink)}

/* 먹었어요 + 내 점심값 */
.cfoot{flex-wrap:wrap}
.cate{display:inline-flex;align-items:center;height:30px;margin-left:auto;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--ink-2);font:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.cate:hover,.nbate:hover{border-color:var(--ink-3);color:var(--ink)}
.cate.on,.nbate.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cate + .cdir{margin-left:0}
.cnow{color:#2FA36B;font-size:12.5px;font-weight:700}
.cnow.warn{color:#E0701F}
.cnow.off{color:var(--ink-3)}
.lend{display:inline-flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12px;font-weight:700;white-space:nowrap}
.lend select{height:28px;padding:0 6px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:12px}
.nbate{flex:0 0 auto;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--ink-2);font:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.nbrecent{margin:-2px 0 12px;color:var(--ink-3);font-size:12.5px;line-height:1.6}
.nbrecent b{color:var(--ink-2)}
#mlBox{margin-top:14px}
details.ml{background:var(--card);border:1px solid var(--line);border-radius:14px}
details.ml summary{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:12px 16px;list-style:none;font-size:13.5px;cursor:pointer}
details.ml summary::-webkit-details-marker{display:none}
details.ml summary::after{content:"▾";margin-left:auto;color:var(--ink-3)}
details.ml[open] summary::after{content:"▴"}
.mlk{font-weight:800}
.mls{color:var(--ink-2)}
.mls b{color:var(--ink);font-variant-numeric:tabular-nums}
.mlg{color:var(--ink-3);font-size:12.5px}
.mlbody{padding:0 16px 14px}
.mlstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-bottom:12px}
.mlstat{padding:10px 12px;border-radius:10px;background:var(--soft)}
.mlstat small{display:block;color:var(--ink-3);font-size:11.5px;font-weight:700}
.mlstat b{display:block;margin-top:2px;font-size:18px;font-variant-numeric:tabular-nums}
.mlstat span{display:block;margin-top:2px;color:var(--ink-3);font-size:12px}
.mllist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.mllist li{display:flex;align-items:center;gap:8px;font-size:13px}
.mld{flex:0 0 66px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mln{flex:1;min-width:0;overflow:hidden;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
.mlp{width:84px;height:30px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;text-align:right}
.mlx{width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--ink-3);cursor:pointer}
.mlx:hover{background:var(--soft);color:var(--ink)}
.mlnote{margin:10px 0 0;color:var(--ink-3);font-size:12px;line-height:1.6}
@media (max-width:600px){.mllist .nbg{display:none}.mld{flex-basis:56px}}
.lghead,.lgrow,.lgtot{display:grid;grid-template-columns:minmax(0,1fr) auto 50px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.lghead{color:var(--ink-3);font-size:11px;font-weight:800;letter-spacing:.04em}
.lgrow.zero{opacity:.45}
.lgcalc{color:var(--ink-3);font-variant-numeric:tabular-nums}
.lgc{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.lgtot{border-top:2px solid var(--ink);border-bottom:0;font-weight:800}
.lgtot .lgc{color:var(--accent);font-size:16px}
.nabadge{margin-left:6px;padding:1px 5px;border-radius:5px;background:var(--soft);color:var(--ink-3);font-size:10px;font-weight:700}
.vshead{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr) auto;gap:8px;align-items:center;margin:20px 0 8px;color:var(--ink-3);font-size:12px}
.vshead b{overflow:hidden;color:var(--ink);font-weight:800;text-overflow:ellipsis;white-space:nowrap}
.vsrow{display:grid;grid-template-columns:minmax(0,1fr) 62px minmax(0,1fr);gap:8px;align-items:center;min-height:24px;font-size:12px}
.vsL,.vsR{display:flex;align-items:center;gap:6px}
.vstrack{flex:1;display:flex;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.vsL .vstrack{justify-content:flex-end}
.vsfill{display:block;height:100%;border-radius:3px;background:var(--ink-3)}
.vsfill.win{background:var(--accent)}
.vsfill.win2{background:var(--ink)}
.vsname{color:var(--ink-2);font-weight:700;text-align:center}
.vsn{width:24px;color:var(--ink-3);text-align:center;font-variant-numeric:tabular-nums}
.vsna{color:var(--ink-3)}
.vsnote{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--soft);color:var(--ink-2);font-size:12.5px;line-height:1.55}
.vsnote b{color:var(--ink)}

/* 식당 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:92px;transition:transform .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-up)}
.card.flash{animation:flash 1.4s ease}
@keyframes flash{0%,45%{box-shadow:0 0 0 3px var(--accent),var(--shadow-up)}100%{box-shadow:var(--shadow)}}
.cthumb{position:relative;flex:0 0 68px;width:68px;height:68px;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;
  background:var(--soft);cursor:zoom-in;overflow:hidden;transition:border-color .15s ease}
.cthumb:disabled{cursor:default}
.cthumb:hover:not(:disabled){border-color:var(--ink-3)}
.cthumb img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top;transition:transform .3s ease}
.cthumb:hover img{transform:scale(1.08)}
.cthumb .art{display:none;width:100%;height:100%;place-items:center}
.cthumb.noimg .art{display:grid}
.cthumb .art svg{width:50px;height:50px}
.cthumb .art circle{fill:var(--card)}
.cthumb .art use{--i1:var(--accent-deep);--i2:var(--ink)}
.cthumb .zoom{position:absolute;right:4px;bottom:4px;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;
  background:rgba(0,0,0,.62);color:#fff}
.cthumb .zoom svg{width:12px;height:12px}
.cbadges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:2px}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;background:var(--soft);color:var(--ink-2);
  font-size:11px;font-weight:800}
.badge.rank{background:var(--accent);color:#fff}
.badge.dist{background:var(--ink);color:var(--card)}
.badge.warn{background:var(--warn-wash);color:var(--warn)}
.cbody{flex:1;display:flex;flex-direction:column;gap:8px;padding:18px 18px 16px}
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.ctitle{min-width:0}
.cname{margin:0;font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1.25;word-break:keep-all;overflow-wrap:anywhere}
.cscore{flex:0 0 auto;font-size:34px;font-weight:800;letter-spacing:-.045em;line-height:.95;text-align:right;font-variant-numeric:tabular-nums}
.cscore small{display:block;margin-top:5px;color:var(--ink-3);font-size:10px;font-weight:700;letter-spacing:.06em}
.cscore.top{color:var(--accent)}
.cscore.na{max-width:84px;color:var(--ink-3);font-size:11.5px;font-weight:700;letter-spacing:0;line-height:1.3}
.cplace{margin-top:5px;color:var(--ink-3);font-size:13px;font-weight:600}
.cmid{display:flex;align-items:flex-start;gap:12px;margin-top:4px}
.cmenu{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cmains{font-size:14px;font-weight:700;line-height:1.45}
.csides{display:-webkit-box;overflow:hidden;color:var(--ink-2);font-size:12.5px;line-height:1.5;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cnone{color:var(--ink-3);font-size:13px}
.cwarn{padding:8px 10px;border-radius:9px;background:var(--warn-wash);color:var(--warn);font-size:12px;line-height:1.5}
.cmore{color:var(--ink-2);font-size:12.5px;line-height:1.6}
.cmore summary{display:inline-block;color:var(--ink-3);font-weight:700;cursor:pointer;list-style:none}
.cmore summary::-webkit-details-marker{display:none}
.cmore summary::after{content:" ▾"}
.cmore[open] summary::after{content:" ▴"}
.cmore p{margin:6px 0 0}
.cfoot{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line-2)}
.cprice{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.cprice.na{color:var(--ink-3);font-size:12.5px;font-weight:700}

const lb = document.getElementById("lb"), lbImg = document.getElementById("lbImg");
document.getElementById("lbClose").onclick = () => lb.close();
lb.addEventListener("click", e => { if (e.target === lb) lb.close(); });

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// 이 사이트는 가산(KST)의 오늘을 기준으로 한다. 보는 사람이 어느 시간대에 있든
// 판정이 흔들리지 않도록 UTC+9 로 옮겨 계산한다.
const kstToday = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
// 메뉴판이 며칠 지난 것인지. 날짜를 모르면 null.
const boardAgeDays = () => {
  const iso = DATA.sourceDateIso;
  if (!iso) return null;
  const diff = Date.parse(kstToday() + "T00:00:00Z") - Date.parse(iso + "T00:00:00Z");
  return Number.isFinite(diff) ? Math.round(diff / 86400e3) : null;
};
const nm = (r) => lang === "ko" ? r.ko : (r.en || r.ko);
const firstDishImg = r => {
  for (const i of r.items) if (i.main && i.dish && DATA.dishImages[i.dish]) return DATA.dishImages[i.dish].thumb;
  for (const i of r.items) if (i.dish && DATA.dishImages[i.dish]) return DATA.dishImages[i.dish].thumb;
  return null;
};
const shortAddr = a => a ? a.replace(/^서울(특별시)?\s*금천구\s*/, "").replace(/^(디지털로|가산디지털\d로|벚꽃로|서부샛길)\S*\s*/, "").replace(/^[\d-]+\s*/, "") : "";


// ---- 추천 ----
// 축별 원점수(0~1)는 빌드 때 계산해 두고, 가중치는 보는 사람이 정한다.
// 모르는 값(가격 미확인 등)은 0.5로 두어 그 식당이 손해도 이득도 보지 않게 한다.
const AXES = ["value","variety","mains","protein","rarity","near"];
const PRESETS = {
  balanced:{value:3,variety:3,mains:3,protein:2,rarity:2,near:2},
  cheap:   {value:5,variety:4,mains:2,protein:1,rarity:1,near:2},
  meat:    {value:1,variety:2,mains:5,protein:5,rarity:2,near:1},
  lazy:    {value:2,variety:2,mains:2,protein:1,rarity:1,near:5},
};
let W = {...PRESETS.balanced};
let ate = [];   // 최근 먹은 식당 id, 최신순
let nearOrigin = null;   // 가까움 점수의 기준 위치 {n, lat, lng}. 건물을 검색하면 정해진다
try { const o = JSON.parse(localStorage.getItem("glb-origin") || "null"); if (o && o.n && o.lat) nearOrigin = o; } catch(e) {}

try { const w = JSON.parse(localStorage.getItem("glb-w") || "null"); if (w) W = {...W, ...w}; } catch(e) {}
try { const a = JSON.parse(localStorage.getItem("glb-ate") || "null"); if (Array.isArray(a)) ate = a.slice(0, 5); } catch(e) {}
const keep = () => { try {
  localStorage.setItem("glb-w", JSON.stringify(W));
  localStorage.setItem("glb-ate", JSON.stringify(ate));
} catch(e) {} };

// ── 점심 기록 (이 기기에만) ───────────────────────────────────
// [{d:"YYYY-MM-DD", k:"c"(구내식당)|"n"(일반식당), id, n(이름), g(업종), p(가격|null)}], 최신이 앞
let lunchLog = [];
try { const L = JSON.parse(localStorage.getItem("glb-log") || "null"); if (Array.isArray(L)) lunchLog = L; } catch(e) {}
const saveLog = () => { try { localStorage.setItem("glb-log", JSON.stringify(lunchLog.slice(0, 400))); } catch(e) {} };
const dayShift = (d, n) => { const x = new Date(d + "T00:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const weekStart = d => dayShift(d, -((new Date(d + "T00:00:00Z").getUTCDay() + 6) % 7));   // 월요일
function fmtDay(d){
  const x = new Date(d + "T00:00:00Z"), m = x.getUTCMonth() + 1, dd = x.getUTCDate();
  return lang === "ko" ? `${m}/${dd} (${"일월화수목금토"[x.getUTCDay()]})` : `${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][x.getUTCDay()]} ${m}/${dd}`;
}
const todayEntry = () => lunchLog.find(e => e.d === kstToday());
// 최근 7일 먹은 구내식당 → 기존 감점 목록(최신순 5곳). 기록이 없으면 예전 목록을 그대로 둔다.
function syncAte(){
  const since = dayShift(kstToday(), -6), ids = [];
  for (const e of lunchLog) if (e.k === "c" && e.d >= since && !ids.includes(e.id)) ids.push(e.id);
  ate = ids.slice(0, 5);
  keep();
}
if (lunchLog.length) syncAte();
// 하루 한 곳. 오늘 이미 같은 곳이면 취소, 다른 곳이면 바꾼다.
function markAte(entry){
  const d = kstToday(), cur0 = todayEntry();
  lunchLog = lunchLog.filter(e => e.d !== d);
  if (!(cur0 && cur0.k === entry.k && cur0.id === entry.id)) lunchLog.unshift({ d, ...entry });
  saveLog();
  syncAte();
}
const ateOnToday = (k, key) => { const e = todayEntry(); return !!e && e.k === k && e.id === key; };
// ── 지금 갈 수 있나 ───────────────────────────────────────────
// 배식 시간은 적힌 범위만 쓴다(추정 금지). 점심(11~14시)에 걸치는 구간, 토요일이면 '토' 구간.
const EAT_MIN = 20;          // 줄 서기 + 먹기 어림(분)
const LUNCH_ENDS = ["12:30", "13:00", "13:30", "14:00"];
let lunchEnd = "13:00";
try { const v = localStorage.getItem("glb-lunchend"); if (LUNCH_ENDS.includes(v)) lunchEnd = v; } catch(e) {}
const kstNow = () => new Date(Date.now() + 9 * 3600e3);
const kstNowMin = () => { const d = kstNow(); return d.getUTCHours() * 60 + d.getUTCMinutes(); };
const hm = m => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}`;
const toMin = s => { const [a, b] = s.split(":").map(Number); return a * 60 + b; };
function servingWindow(r){
  const src = r.hoursKo || r.hoursEn || "";
  if (!src) return null;
  const segs = src.split(/[·,/]/).map(s => s.trim()).filter(Boolean);
  const sat = kstNow().getUTCDay() === 6;
  const seg = segs.find(s => sat ? /토|sat/i.test(s) : !/토|sat/i.test(s)) || (sat ? null : segs[0]);
  if (!seg) return null;
  const re = /(\d{1,2})\s*[:시]\s*(\d{2})?\s*분?\s*[~\-–]\s*(\d{1,2})\s*[:시]?\s*(\d{2})?/g;
  for (let m; (m = re.exec(seg)); ){
    const a = +m[1] * 60 + +(m[2] || 0), b = +m[3] * 60 + +(m[4] || 0);
    if (b > a && a < 14 * 60 && b > 11 * 60) return [a, b];
  }
  return null;
}
function nowState(r){
  const w = servingWindow(r); if (!w) return null;
  const n = kstNowMin();
  if (n < w[0]) return { code: "before", min: w[0] - n, at: w[0] };
  if (n < w[1]) return { code: "open", min: w[1] - n, at: w[1] };
  return { code: "done" };
}
const isDone = r => nowState(r)?.code === "done";
// 지금 나가면 몇 시에 돌아오나. 사무실(가까움 기준)이 있고 10:30~점심 끝 사이일 때만.
function roundTrip(r){
  const o = nearOrigin, n = kstNowMin();
  if (!o || r.lat == null || n < 10 * 60 + 30 || n > toMin(lunchEnd)) return null;
  const walk = walkFrom(r, o), st = nowState(r);
  let start = n + walk;
  if (st && st.code === "before") start = Math.max(start, st.at);
  const back = start + EAT_MIN + walk;
  return { back, tight: back > toMin(lunchEnd), late: !!st && st.code === "open" && n + walk >= st.at };
}
function nowHtml(r){
  const t = T[lang], st = nowState(r), rt = roundTrip(r), parts = [];
  let cls = "";
  if (st){
    if (st.code === "before") parts.push(t.nowBefore(hm(st.at), st.min));
    else if (st.code === "open"){ parts.push(t.nowOpen(st.min)); if (st.min <= 20) cls = "warn"; }
    else { parts.push(t.nowDone); cls = "off"; }
  }
  if (rt && !(st && st.code === "done")){
    if (rt.late){ parts.push(t.nowLate); cls = "off"; }
    else { parts.push(t.nowBack(hm(rt.back))); if (rt.tight){ parts.push(t.nowTight(lunchEnd)); cls = cls || "warn"; } }
  }
  return parts.length ? `<div class="cnow${cls ? " " + cls : ""}">${esc(parts.join(" · "))}</div>` : "";
}

  return `<button type="button" class="${k === "c" ? "cate" : "nbate"}${on ? " on" : ""}" data-ate="${esc(data)}" aria-pressed="${on}">${esc(label)}</button>`;

function scored(){
  const out = [];
  const NV = nearVals();                  // 기준 위치가 없으면 null — 모두 중립
  for (const r of DATA.restaurants){
    const ax = DATA.axes && DATA.axes[r.id];
    if (!ax) continue;                       // 오늘 메뉴가 제대로 올라온 곳만
    let sum = 0, wsum = 0;
    const parts = [];
    for (const a of AXES){
      const w = W[a] || 0;
      const v = a === "near" ? (NV ? (NV[r.id] ?? null) : null) : ax[a];
      parts.push({ axis:a, value:v, weight:w });
      if (!w) continue;
      sum += (v === null ? 0.5 : v) * w;     // 정보 없으면 중립
      wsum += w;
    }
    let score = wsum ? sum / wsum : 0;
    // 최근에 간 곳은 낮춘다. 바로 어제 갔으면 많이, 닷새 전이면 조금.
    const seen = ate.indexOf(r.id);
    const penalty = seen === -1 ? 0 : 0.28 / (seen + 1);
    score = Math.max(0, score - penalty);
    out.push({ r, ax, parts, score: Math.round(score * 1000) / 10, penalty });
  }
  out.sort((a,b) => b.score - a.score);
  return out;
}

// 축마다 값을 아는 곳이 몇 곳인지. 데이터가 얇은 축에 가중치를 크게 주면
// 순위가 아니라 결측을 반영하게 되므로, 그 사실을 화면에 드러낸다.
function coverage(){
  const ids = Object.keys(DATA.axes || {});
  const c = {};
  for (const a of AXES) c[a] = ids.filter(id => DATA.axes[id][a] !== null).length;
  c._total = ids.length;
  return c;
}

function tuneLiveHtml(){
  const t = T[lang], list = scored();
  if (!list.length) return `<p class="vsnote">${esc(t.onlyOne)}</p>`;
  const top = list[0], second = list[1];
  const W_SUM = AXES.reduce((a, x) => a + (W[x] || 0), 0);
  // 장부: 각 축의 기여도를 합하면 정확히 총점이 되도록 나눈다.
  const rows = top.parts.map(pt => {
    const v = pt.value === null ? 0.5 : pt.value;
    return { ...pt, shown: Math.round(v * 100), contrib: W_SUM ? (v * pt.weight / W_SUM) * 100 : 0 };
  });
  const ledger = `<h3>${esc(t.whyTitle)} · ${esc(nm(top.r))}</h3><div class="ledger">

  </div>`;
  if (!second) return ledger + `<div class="vsnote">${esc(t.onlyOne)}</div>`;

  const val = (s, a) => s.parts.find(x => x.axis === a).value;
  const gap = Math.round((top.score - second.score) * 10) / 10;
  const versus = `<div class="vshead"><span>1</span><b>${esc(nm(top.r))}</b><span>vs</span><b style="text-align:right">${esc(nm(second.r))}</b><span>2</span></div>
    ${AXES.map(a => {
      const lv = val(top, a), rv = val(second, a);
      if (lv === null && rv === null) return `<div class="vsrow"><span></span><span class="vsname">${esc(t.axes[a])}</span><span class="vsna">${esc(t.na)}</span></div>`;
      const l = lv === null ? .5 : lv, r = rv === null ? .5 : rv, lw = l > r + .02, rw = r > l + .02;
      return `<div class="vsrow">
        <span class="vsL"><span class="vsn">${Math.round(l * 100)}</span><span class="vstrack"><span class="vsfill${lw ? " win" : ""}" style="width:${Math.round(l * 100)}%"></span></span></span>
        <span class="vsname">${esc(t.axes[a])}</span>
        <span class="vsR"><span class="vstrack"><span class="vsfill${rw ? " win2" : ""}" style="width:${Math.round(r * 100)}%"></span></span><span class="vsn">${Math.round(r * 100)}</span></span></div>`;
    }).join("")}
    <div class="vsnote">${t.vsNote(esc(nm(second.r)), gap)}</div>`;
  return ledger + versus;
}

// 아이콘 <symbol> 을 문서에 한 번 심어 두고, 쓰는 곳은 <use href> 로 가리키기만 한다.
// display:none 인 SVG 안의 symbol 은 일부 브라우저가 안 그리므로 크기 0 으로 숨긴다.
(document.body || document.documentElement).insertAdjacentHTML("afterbegin",
  `<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">${ICON_DEFS}</svg>`);

// ── 식당 지도 ────────────────────────────────────────────────
// 밑그림은 OSM 도로·철길·쇼핑몰(data/streets.json), 식당 좌표는 네이버 길찾기 링크에서
// 풀어낸 값이다. 둘 다 같은 좌표계라 식당이 제 길 옆에 앉는다.
// viewBox 한 칸을 1m 로 둔다. 글자 크기도 미터로 적으니 화면이 달라져도 비율이 같다.
const GM_PAD = 120;
const GM_MX = 111320 * Math.cos(37.478 * Math.PI / 180), GM_MY = 111000;
const GM_ROAD_W = { trunk: 30, primary: 30, secondary: 24, tertiary: 17, unclassified: 10, residential: 10 };
// 이름을 적을 도로. 큰길은 다 적고, 골목은 식당 주소에 나오는 것만.
const GM_ROAD_NAMED = new Set(["trunk", "primary", "secondary", "tertiary"]);
const GM_ROAD_EXTRA = new Set(["서부샛길", "디지털로9길"]);
const GM_LANDMARK = {
  "마리오아울렛": ["마리오아울렛", "Mario Outlet"],
  "마리오아울렛 2관": ["2관", "Mario 2"],
  "마리오아울렛 3관": ["3관", "Mario 3"],
  "W몰": ["W몰", "W Mall"],
  "롯데팩토리아울렛 가산점": ["롯데아울렛", "Lotte Outlet"],
};
let gmNb = {}, mapNbSel = null;  // 지도에 그린 일반식당 건물 묶음, 그중 누른 것
let mapSel = null;              // 사용자가 누른 식당. 없으면 오늘의 추천을 보여 준다
let mapNear = null, mapNearKey = "";   // 건물 검색 중이면 그 건물

// ── 건물로 찾기 ───────────────────────────────────────────────
// 띄어쓰기는 무시한다 ("갑을 그레이트밸리" = "갑을그레이트밸리").
const normQ = s => (s || "").toLowerCase().replace(/\s+/g, "");
const gmDist = (a, b) => Math.hypot((a.lng - b.lng) * GM_MX, (a.lat - b.lat) * GM_MY);
// 식당이 없는 건물을 쳐도 근처 식당을 보여 주려고 OSM 건물 이름을 들고 있다.
// 딱 맞는 이름 > 앞부분이 맞는 이름 > 어딘가 들어 있는 이름 순, 같으면 짧은 이름.
function findBuilding(nterm){
  const B = (DATA.streets && DATA.streets.buildings) || [];
  if (nterm.length < 2) return null;
  let best = null, bs = 0;
  for (const b of B){
    const nb = normQ(b.n);
    const s = nb === nterm ? 3 : nb.startsWith(nterm) ? 2 : nb.includes(nterm) ? 1 : 0;
    if (s > bs || (s && s === bs && nb.length < normQ(best.n).length)){ best = b; bs = s; }
  }
  return best ? { n: best.n, lat: best.p[0], lng: best.p[1] } : null;
}

// 기준 위치에서 잰 거리를 0~1 가까움으로 편다. 점수 대상 중 가장 가까운 곳 1, 가장 먼 곳 0.
let nearCache = { key: "", vals: null };
function nearVals(){
  if (!nearOrigin) return null;
  const key = `${nearOrigin.n}|${nearOrigin.lat}|${nearOrigin.lng}`;
  if (nearCache.key === key) return nearCache.vals;
  const pool = DATA.restaurants.filter(r => DATA.axes && DATA.axes[r.id] && r.lat != null);
  const d = {}; for (const r of pool) d[r.id] = gmDist(r, nearOrigin);
  const ds = Object.values(d), lo = Math.min(...ds), hi = Math.max(...ds);
  const vals = {}; for (const id in d) vals[id] = hi > lo ? (hi - d[id]) / (hi - lo) : .5;
  nearCache = { key, vals };
  return vals;
}
function saveOrigin(){ try { nearOrigin ? localStorage.setItem("glb-origin", JSON.stringify(nearOrigin)) : localStorage.removeItem("glb-origin"); } catch(e) {} }

const NEAR_N = 5;                 // 건물 검색 때 보여 줄 가까운 식당 수
let mapJustFocused = false;       // 방금 다른 건물을 찾았으면 화면을 지도로 옮긴다

function mapFrame(focus, grow = 1){
  if (focus){
    // 건물 검색: 그 건물을 한가운데 두고, 가까운 곳들이 다 들어오게 확대한다
    const far = Math.max(0, ...focus.pts.map(r => Math.max(
      Math.abs(r.lng - focus.c.lng) * GM_MX, Math.abs(r.lat - focus.c.lat) * GM_MY)));
    const R = Math.max(260, far * 1.35 + 90) * grow;
    const W = Math.round(R * 2), H = Math.round(R * 2.1);
    const lng0 = focus.c.lng - R / GM_MX, lat1 = focus.c.lat + (H / 2) / GM_MY;
    return { W, H, X: lng => (lng - lng0) * GM_MX, Y: lat => (lat1 - lat) * GM_MY };
  }
  // 평소 틀은 전체 식당 기준이다. 검색으로 몇 곳만 남아도 지도가 튀지 않게.
  const pts = DATA.restaurants.filter(r => r.lat != null);
  const la = pts.map(r => r.lat), lo = pts.map(r => r.lng);
  const lat1 = Math.max(...la), lng0 = Math.min(...lo);
  const W = Math.round((Math.max(...lo) - lng0) * GM_MX + GM_PAD * 2);
  const H = Math.round((lat1 - Math.min(...la)) * GM_MY + GM_PAD * 2);
  return { W, H, X: lng => (lng - lng0) * GM_MX + GM_PAD, Y: lat => (lat1 - lat) * GM_MY + GM_PAD };
}
const gmPath = (pts, F) => pts.map((q, i) => `${i ? "L" : "M"}${F.X(q[1]).toFixed(1)} ${F.Y(q[0]).toFixed(1)}`).join("");
// 글자 폭 어림. 한글은 1em, 영숫자는 그보다 좁다.
const gmTextW = (s, fs) => [...s].reduce((a, ch) =>
  a + (/[\u3131-\u318E\uAC00-\uD7A3]/.test(ch) ? 1 : /[A-Z0-9]/.test(ch) ? .66 : ch === " " ? .32 : .56), 0) * fs;
const gmShort = r => lang === "ko"
  ? r.ko.replace(/\s*구내식당$/, "").replace(/^미가푸드빌\s*/, "미가 ")
  : (r.en || r.ko).replace(/\s*(company\s+)?cafeteria$/i, "");
const gmArea = (a, b) => Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x))
                       * Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));
const gmStation = () => {
  const S = DATA.streets;
  if (S && S.stations.length) return {
    lat: S.stations.reduce((a, s) => a + s.p[0], 0) / S.stations.length,
    lng: S.stations.reduce((a, s) => a + s.p[1], 0) / S.stations.length };
  return DATA.station || null;
};

// 지도 표시 모양 (확대 전 단위, 가운데가 0,0). 구내식당 = 식판, 일반식당 = 숟가락·젓가락
const TRAY = `<rect class="tb" x="-21" y="-15" width="42" height="30" rx="8"/>`
  + `<rect class="tw" x="-15" y="-9" width="8.5" height="7.5" rx="2"/><rect class="tw" x="-4.25" y="-9" width="8.5" height="7.5" rx="2"/>`
  + `<rect class="tw" x="6.5" y="-9" width="8.5" height="7.5" rx="2"/><rect class="tw" x="-15" y="1.5" width="30" height="8" rx="2.5"/>`;
const SPOON = `<circle class="sb" r="15"/><ellipse class="si" cx="-4.5" cy="-4.5" rx="3.2" ry="4.3"/>`
  + `<path class="sl" d="M-4.5 -1V9M2.6 -9 3.4 9M6.6 -9 5.8 9"/>`;
const legTray = cls => `<svg class="glegi" viewBox="-23 -17 46 34" width="24" height="18" aria-hidden="true"><g class="gmark${cls ? " " + cls : ""}">${TRAY}</g></svg>`;
const legSpoon = () => `<svg class="glegi" viewBox="-17 -17 34 34" width="18" height="18" aria-hidden="true"><g class="gnbm">${SPOON}</g></svg>`;
// 묶음 자리에서 45m 안의 이름 있는 건물(OSM). 없으면 빈 문자열
function gmBuildingAt(c){
  const bs = DATA.streets && DATA.streets.buildings; if (!bs) return "";
  let best = "", bd = 45;
  for (const x of bs){ const d = gmDist({ lat: x.p[0], lng: x.p[1] }, c); if (d < bd){ bd = d; best = x.n; } }
  return best;
}
function nbClusterCard(c){
  const t = T[lang], o = nbOrigin(), n = c.ps.length, d = o ? gmDist(c, o) : null;
  const far = d == null ? "" : d < 30 ? t.nbSame : t.walkFrom(walkFrom(c, o));
  const rows = c.ps.slice(0, 12).map(({ p }) => `<li><span class="gnbn">${esc(p.n)}</span><i class="nbg">${esc(grpName(p.g))}</i><a href="${kakaoLink(p)}" target="_blank" rel="noopener" aria-label="${esc(p.n)} ${esc(t.nbKakao)}">${esc(t.nbKakao)} ↗</a></li>`).join("");
  return `<div class="gnbhead">${legSpoon()}<div><div class="gcname">${esc(gmBuildingAt(c) || t.nbHere)}</div>
    <div class="gcmeta">${esc([t.nbInBldg(n), far].filter(Boolean).join(" · "))}</div></div></div>
    <ul class="gnblist">${rows}</ul>${n > 12 ? `<div class="gnbmore">${esc(t.nbEtc(n - 12))}</div>` : ""}`;
}

function mapHtml(shownList, near){
  const t = T[lang], S = DATA.streets;
  // 검색한 건물이 바뀌면 전에 누른 식당 선택은 풀고, 화면을 지도로 옮긴다
  const nk = near ? near.n : "";
  if (nk !== mapNearKey){ mapSel = null; mapNearKey = nk; mapJustFocused = !!near; }
  mapNear = near || null;
  const shown = shownList.filter(x => x.r.lat != null);
  if (!shown.length) return "";
  // 좁은 화면은 평소 지도를 700px 로 그려 밀어 보게 한다. 건물 검색 때는 화면 폭에 맞춘다.
  const narrow = matchMedia("(max-width:900px)").matches;
  const F = near ? mapFrame({ c: near, pts: shown.map(x => x.r) }, narrow ? 1.3 : 1) : mapFrame(), W = F.W, H = F.H;
  // 확대하면 viewBox 한 칸이 화면에서 커진다. 글자·점·선 굵기는 평소 전체 지도와 같은 크기로
  // 보이도록 비율 K 를 곱한다 (평소 K = 1). 좁은 화면에서는 평소 지도가 700px, 건물 검색
  // 지도는 화면 폭이라 그 차이까지 넣는다.
  const FULLW = mapFrame().W;
  const pxW = (document.querySelector("#gmap .gmcanvas") || {}).clientWidth || Math.max(280, innerWidth - 28);
  const K = !near ? 1 : narrow ? 700 * W / (FULLW * pxW) : W / FULLW;
  const at = (x, y, rot) => `translate(${x.toFixed(1)} ${y.toFixed(1)})${rot != null ? ` rotate(${rot.toFixed(1)})` : ""} scale(${K.toFixed(3)})`;
  const top = scored()[0], topId = top ? top.r.id : null;
  const scoreOf = {}; for (const s of scored()) scoreOf[s.r.id] = s.score;
  const inside = (x, y) => x > 0 && y > 0 && x < W && y < H;
  const obst = [];                                   // 이름표가 피해야 할 자리

  // 쇼핑몰 — 가산 사람이면 누구나 아는 기준점
  let malls = "", mallN = "";
  for (const m of (S ? S.landmarks : [])){
    const nmk = GM_LANDMARK[m.n]; if (!nmk) continue;
    let cx, cy;
    if (m.poly){
      malls += `<path class="gmall" style="stroke-width:${(2 * K).toFixed(2)}" d="${gmPath(m.poly, F)}Z"/>`;
      cx = m.poly.reduce((a, q) => a + F.X(q[1]), 0) / m.poly.length;
      cy = m.poly.reduce((a, q) => a + F.Y(q[0]), 0) / m.poly.length;
    } else { cx = F.X(m.p[1]); cy = F.Y(m.p[0]); }
    if (!inside(cx, cy)) continue;
    const lb = nmk[lang === "ko" ? 0 : 1], w = gmTextW(lb, 17) * K;
    mallN += `<text class="gmalln" transform="${at(cx, cy + 5 * K)}">${esc(lb)}</text>`;
    obst.push({ x: cx - w / 2 - 4 * K, y: cy - 11 * K, w: w + 8 * K, h: 22 * K });
  }

  // 도로 — 테두리를 먼저 다 깔고 속을 칠해야 교차로가 이어져 보인다
  const byK = {};
  for (const rd of (S ? S.roads : [])) (byK[rd.k] = byK[rd.k] || []).push(gmPath(rd.p, F));
  let casing = "", fill = "";
  for (const cls of ["residential", "unclassified", "tertiary", "secondary", "primary", "trunk"]) if (byK[cls]){
    const d = byK[cls].join(""), w = GM_ROAD_W[cls] * K;
    casing += `<path class="grd-c" stroke-width="${(w + 6 * K).toFixed(2)}" d="${d}"/>`;
    fill += `<path class="grd-f" stroke-width="${w.toFixed(2)}" d="${d}"/>`;
  }
  const railD = (S ? S.rails : []).map(r => gmPath(r.p, F)).join("");
  const rails = railD ? `<path class="grail-b" style="stroke-width:${(9 * K).toFixed(2)}" d="${railD}"/>`
    + `<path class="grail-t" style="stroke-width:${(4 * K).toFixed(2)};stroke-dasharray:${(14 * K).toFixed(1)} ${(12 * K).toFixed(1)}" d="${railD}"/>` : "";

  // 도로 이름 — 이름마다 화면 안의 가장 긴 곧은 구간 한가운데에 한 번만.
  // 확대했을 때는 자리가 넉넉하니 골목 이름도 다 적는다.
  const best = {}, edge = 30 * K, nameAll = K < .8;
  for (const rd of (S ? S.roads : [])){
    if (!rd.n || /지하/.test(rd.n) || !(nameAll || GM_ROAD_NAMED.has(rd.k) || GM_ROAD_EXTRA.has(rd.n))) continue;
    for (let i = 0; i < rd.p.length - 1; i++){
      const x1 = F.X(rd.p[i][1]), y1 = F.Y(rd.p[i][0]), x2 = F.X(rd.p[i + 1][1]), y2 = F.Y(rd.p[i + 1][0]);
      if (![x1, x2].every(x => x > edge && x < W - edge) || ![y1, y2].every(y => y > edge && y < H - edge)) continue;
      const L = Math.hypot(x2 - x1, y2 - y1);
      if (!best[rd.n] || L > best[rd.n].L) best[rd.n] = { L, x1, y1, x2, y2 };
    }
  }
  let roadN = "";
  for (const [n, s] of Object.entries(best)){
    if (s.L < (gmTextW(n, 17) + 30) * K) continue;
    let a = Math.atan2(s.y2 - s.y1, s.x2 - s.x1) * 180 / Math.PI;
    if (a > 90) a -= 180; if (a < -90) a += 180;      // 글자가 뒤집히지 않게
    roadN += `<text class="groadn" transform="${at((s.x1 + s.x2) / 2, (s.y1 + s.y2) / 2, a)}" dy="5">${esc(n)}</text>`;
  }

  // 역 (확대 전 단위로 그리고 K 배)
  const stg = gmStation();
  let staEl = "";
  if (stg){
    const sx = F.X(stg.lng), sy = F.Y(stg.lat);
    if (inside(sx, sy)){
      const lb = t.mapSta, w = gmTextW(lb, 18) + 24, bh = 34;
      // 지도 가장자리에 걸리면 이름표만 안쪽으로 민다 (점과 선은 제자리)
      let bx = -w / 2;
      const left = sx + bx * K, right = sx + (bx + w) * K;
      if (left < 8 * K) bx += (8 * K - left) / K;
      if (right > W - 8 * K) bx -= (right - (W - 8 * K)) / K;
      staEl = `<g class="gsta" transform="${at(sx, sy)}"><line x1="0" y1="-18" x2="0" y2="0"/><circle r="9"/>
        <rect x="${bx.toFixed(0)}" y="${-bh - 18}" width="${w.toFixed(0)}" height="${bh}" rx="9"/>
        <text x="${(bx + w / 2).toFixed(0)}" y="${-bh / 2 - 17}">${esc(lb)}</text></g>`;
      obst.push({ x: sx + (bx - 4) * K, y: sy - (bh + 22) * K, w: (w + 8) * K, h: (bh + 34) * K });
    }
  }

  // 검색한 건물 — 식당 이름표가 이걸 가리지 않게 자리를 먼저 잡는다
  let hereEl = "";
  if (near){
    const hx = F.X(near.lng), hy = F.Y(near.lat), lb = near.n;
    const w = gmTextW(lb, 19) + 26, bh = 36;
    const above = hy - (bh + 26) * K > 8 * K;
    const by = above ? -bh - 26 : 26;
    let bx = -w / 2;
    const left = hx + bx * K, right = hx + (bx + w) * K;
    if (left < 8 * K) bx += (8 * K - left) / K;
    if (right > W - 8 * K) bx -= (right - (W - 8 * K)) / K;
    hereEl = `<g class="ghere" transform="${at(hx, hy)}"><circle class="ghere-ring" r="24"/>
      <line x1="0" y1="${above ? by + bh : by}" x2="0" y2="0"/><circle class="ghere-dot" r="11"/>
      <rect x="${bx.toFixed(0)}" y="${by}" width="${w.toFixed(0)}" height="${bh}" rx="10"/>
      <text x="${(bx + w / 2).toFixed(0)}" y="${by + bh / 2 + 1}">${esc(lb)}</text></g>`;
    obst.push({ x: hx + (bx - 4) * K, y: hy + (by - 4) * K, w: (w + 8) * K, h: (bh + 8) * K },
              { x: hx - 26 * K, y: hy - 26 * K, w: 52 * K, h: 52 * K });
  }

  // 식당 점 — 같은 건물에 둘이면 옆으로 조금 벌린다
  const P = shown.map(({ r }) => ({ r, x: F.X(r.lng), y: F.Y(r.lat) }));
  const seen = {};
  for (const q of P){
    const key = `${q.x.toFixed(0)},${q.y.toFixed(0)}`;
    const n = seen[key] = (seen[key] || 0) + 1;
    if (n > 1) q.x += (n - 1) * 46 * K;
  }
  const MR = 16;                                       // 확대 전 단위
  for (const q of P) obst.push({ x: q.x - (MR + 3) * K, y: q.y - (MR + 3) * K, w: (MR * 2 + 6) * K, h: (MR * 2 + 6) * K });

  // 이름표 — 추천을 먼저, 그다음 이웃이 많은 곳부터 자리를 잡는다
  const crowd = q => P.filter(o => o !== q && Math.hypot(o.x - q.x, o.y - q.y) < 180 * K).length;
  const ordered = [...P].sort((a, b) => (b.r.id === topId) - (a.r.id === topId) || crowd(b) - crowd(a));
  const FS = 21, CH = 37, PADX = 14, placed = [];
  for (const q of ordered){
    const lb = gmShort(q.r);
    // 건물 검색 때는 이름표에 추천 점수를 붙인다
    const sc = near && scoreOf[q.r.id] != null ? scoreOf[q.r.id].toFixed(1) : "";
    const wl = gmTextW(lb, FS) + (sc ? gmTextW(sc, FS) + 10 : 0) + PADX * 2;   // 확대 전 폭
    const w = wl * K, h = CH * K;
    let chip = null, bestPen = Infinity;
    search: for (const g0 of [10, 38, 72, 112, 158, 210]){
      const d = (MR + g0) * K, e = d * .72;
      for (const [x, y] of [
        [q.x + d, q.y - h / 2], [q.x - d - w, q.y - h / 2],
        [q.x - w / 2, q.y - d - h], [q.x - w / 2, q.y + d],
        [q.x + e, q.y - e - h], [q.x + e, q.y + e],
        [q.x - e - w, q.y - e - h], [q.x - e - w, q.y + e]]){
        if (x < 8 * K || y < 8 * K || x + w > W - 8 * K || y + h > H - 8 * K) continue;
        const rc = { x, y, w, h, g: g0 };
        const pen = placed.reduce((a, o) => a + gmArea(rc, o), 0) + obst.reduce((a, o) => a + gmArea(rc, o), 0);
        if (pen === 0){ chip = rc; break search; }
        if (pen < bestPen){ bestPen = pen; chip = rc; }
      }
    }
    if (!chip) chip = { x: Math.max(4, Math.min(W - w - 4, q.x + (MR + 10) * K)), y: Math.max(4, Math.min(H - h - 4, q.y - h / 2)), w, h, g: 10 };
    placed.push(chip);
    Object.assign(q, { chip, lb, sc, wl });
  }

  const leads = [], marks = [], chips = [];
  for (const q of P){
    const c = q.chip, cls = (q.r.id === topId ? " pick" : "") + (q.r.items.length ? "" : " none");
    if (c.g > 10){
      const ex = Math.max(c.x, Math.min(q.x, c.x + c.w)), ey = Math.max(c.y, Math.min(q.y, c.y + c.h));
      leads.push(`<line class="glead" style="stroke-width:${(2.2 * K).toFixed(2)}" x1="${q.x.toFixed(1)}" y1="${q.y.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}"/>`);
    }
    marks.push(`<g class="gmark${cls}" data-id="${esc(q.r.id)}" transform="${at(q.x, q.y)}">${TRAY}</g>`);
    chips.push(`<g class="gchip${cls}" data-id="${esc(q.r.id)}" tabindex="0" role="button" aria-label="${esc(nm(q.r))}">
      <g transform="${at(c.x + c.w / 2, c.y + c.h / 2)}"><rect x="${(-q.wl / 2).toFixed(1)}" y="${-CH / 2}" width="${q.wl.toFixed(1)}" height="${CH}" rx="${CH / 2}"/>
      <text y="1">${esc(q.lb)}${q.sc ? `<tspan class="gsc" dx="10">${q.sc}</tspan>` : ""}</text></g></g>`);
  }

  // 근처 일반식당 — 작은 점. 기준 건물 둘레에 지금 고른 도보 반경 원을 그린다
  let nbEl = "";
  gmNb = {};
  if (kindF !== "caf" && NB.length && nbOrigin()){
    const o = nbOrigin(), ox = F.X(o.lng), oy = F.Y(o.lat);
    nbEl = `<circle class="gradius" cx="${ox.toFixed(1)}" cy="${oy.toFixed(1)}" r="${nbRadiusM().toFixed(1)}" style="stroke-width:${(2 * K).toFixed(2)};stroke-dasharray:${(10 * K).toFixed(1)} ${(8 * K).toFixed(1)}"/>`;
    // 인허가 좌표는 건물 중심점 — 18m 안은 한 건물로 묶는다(가까운 곳부터 씨앗)
    const cl = [];
    for (const x of nbList()){
      let c = cl.find(c => gmDist(c, x.p) < 18);
      if (!c){ c = { lat: x.p.lat, lng: x.p.lng, ps: [] }; cl.push(c); }
      c.ps.push(x);
    }
    for (const c of cl){
      const cx = F.X(c.lng), cy = F.Y(c.lat);
      if (!inside(cx, cy)) continue;
      const key = `${c.lat.toFixed(5)},${c.lng.toFixed(5)}`, n = c.ps.length;
      gmNb[key] = c;
      const names = c.ps.slice(0, 6).map(x => x.p.n).join(", ") + (n > 6 ? ` ${t.nbEtc(n - 6)}` : "");
      const bw = 12 + String(n).length * 10;
      // 한 곳뿐인 건물은 작고 흐리게 — 여러 곳 모인 건물이 먼저 눈에 들어오게
      nbEl += `<g class="gnbm${n === 1 ? " one" : ""}${key === mapNbSel ? " on" : ""}" data-nbk="${key}" transform="${at(cx, cy)}">`
        + (n === 1 ? `<g transform="scale(.8)">${SPOON}</g>` : SPOON)
        + (n > 1 ? `<g class="gnbc" transform="translate(15 -14)"><rect x="${-bw / 2}" y="-11" width="${bw}" height="22" rx="11"/><text y="1">${n}</text></g>` : "")
        + `<title>${esc(names)}</title></g>`;
    }
  }

  // 축척 막대는 화면에서 200px 쯤 되는 딱 떨어지는 거리로
  const Lm = [50, 100, 200, 300, 500].reduce((a, b) => Math.abs(b - 200 * K) < Math.abs(a - 200 * K) ? b : a);
  const scale = `<g class="gscale" transform="${at(40 * K, H - 44 * K)}"><path d="M0 0v12h${(Lm / K).toFixed(1)}v-12"/><text x="${(Lm / K / 2).toFixed(1)}" y="-10">${esc(t.mapM(Lm))}</text></g>`;
  const north = `<g class="gnorth" transform="${at(W - 44 * K, 26 * K)}"><path d="M0 0l9 24h-18z"/><text y="44">N</text></g>`;
  const attr = `<text class="gattrs" transform="${at(W - 14 * K, H - 14 * K)}">© OpenStreetMap</text>`;

  return `<div class="gmhead"><span class="t">${esc(t.mapTitle)}</span><span class="h">${esc(t.mapHint)}</span></div>
  <div class="gmbody${near ? " near" : ""}">
    <div class="gmcanvas"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t.mapTitle)}">
      <g>${malls}</g><g>${casing}${fill}</g>${rails}<g>${roadN}</g><g>${nbEl}</g><g>${mallN}</g>${staEl}
      <g>${leads.join("")}</g><g>${marks.join("")}</g><g>${chips.join("")}</g>${hereEl}${scale}${north}${attr}</svg></div>
    <div class="gmside"><div class="gmsticky"><div id="gmcard"></div>
      <div class="gmlegend">
        <span class="gmleg">${legTray("pick")}${esc(t.mapPick)}</span>
        <span class="gmleg">${legTray("")}${esc(t.mapOpen)}</span>
        <span class="gmleg">${legTray("none")}${esc(t.mapNone)}</span>
        <span class="gmleg"><i class="gsw sta"></i>${esc(t.mapSta)}</span>${nbEl ? `<span class="gmleg">${legSpoon()}${esc(t.mapNb)}</span>` : ""}${near ? `<span class="gmleg"><i class="gsw here"></i>${esc(t.mapHere)}</span>` : ""}</div>
      <div class="gmattr">${esc(t.mapAttr)} © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div>
    </div></div>
  </div>`;
}

// 역에서 걸어서 몇 분. 직선거리에 골목 우회분 30%를 얹고 분당 75m 로 나눈 어림값이다.
function gmWalk(r){
  const st = gmStation(); if (!st || r.lat == null) return null;
  const m = Math.hypot((r.lng - st.lng) * GM_MX, (r.lat - st.lat) * GM_MY);
  return Math.max(1, Math.round(m * 1.3 / 75));
}
function gmCurrentId(){
  const ids = [...document.querySelectorAll("#gmap .gchip")].map(g => g.dataset.id);
  if (mapSel && ids.includes(mapSel)) return mapSel;
  if (mapNear) return ids[0];                 // 가까운 순으로 늘어서 있다
  const top = scored()[0];
  return top && ids.includes(top.r.id) ? top.r.id : ids[0];
}
function mapCard(r){
  const t = T[lang], top = scored()[0], isPick = !!top && top.r.id === r.id;
  const sc = scored().find(x => x.r.id === r.id);
  const fam = dishFamily(r);
  const mains = r.items.filter(i => i.main).slice(0, 2).map(i => lang === "ko" ? i.ko : i.en);
  const walk = mapNear ? Math.max(1, Math.round(gmDist(r, mapNear) * 1.3 / 75)) : gmWalk(r);
  const price = r.price ? (lang === "ko" ? `${r.price.toLocaleString("ko-KR")}원` : `₩${r.price.toLocaleString("en-US")}`) : "";
  const meta = [walk ? (mapNear ? t.cardWalkFrom(mapNear.n, walk) : t.cardWalk(walk)) : "", price].filter(Boolean).join(" · ");
  return `<div class="gcard${isPick ? " pick" : ""}${r.items.length ? "" : " none"}">
    <div class="gcart"><svg viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="29"></circle><use href="#i-${fam}" x="12" y="12" width="40" height="40"></use></svg></div>
    <div class="gcbody">
      ${isPick ? `<span class="gctag">${esc(t.cardPick)}</span>` : ""}
      <div class="gcname">${esc(nm(r))}</div>
      ${sc ? `<div class="gcscore"><b>${sc.score.toFixed(1)}</b>${esc(t.cardScore)}</div>` : ""}
      ${r.address ? `<div class="gcaddr">${esc(shortAddr(r.address))}</div>` : ""}
      <div class="gcdish">${mains.length ? esc(mains.join(" · ")) : esc(t.cardNone)}</div>
      ${meta ? `<div class="gcmeta">${esc(meta)}</div>` : ""}
      <div class="gcbtns"><button type="button" class="gcopen">${esc(t.cardMenu)}</button>${r.directions ? `<a class="gcdir" href="${esc(r.directions)}" target="_blank" rel="noopener">${esc(t.cardDir)} ↗</a>` : ""}</div>
    </div></div>`;
}
function gmDraw(){
  const box = document.getElementById("gmcard"); if (!box) return;
  const nb = mapNbSel && gmNb[mapNbSel];
  document.querySelectorAll("#gmap .gnbm[data-nbk]").forEach(el => el.classList.toggle("on", !!nb && el.dataset.nbk === mapNbSel));
  if (nb){
    box.innerHTML = nbClusterCard(nb);
    document.querySelectorAll("#gmap .gchip, #gmap .gmark[data-id]").forEach(el => el.classList.remove("on"));
    return;
  }
  const id = gmCurrentId(), r = DATA.restaurants.find(x => x.id === id);
  box.innerHTML = r ? mapCard(r) : "";
  document.querySelectorAll("#gmap .gchip, #gmap .gmark[data-id]").forEach(el => el.classList.toggle("on", el.dataset.id === id));
  box.querySelector(".gcopen")?.addEventListener("click", () => goCard(id));
}
// 가중치를 바꾸면 추천 카드만 다시 그린다. 지도 강조와 카드도 같이 따라가게 한다.
function syncMapPick(){
  const top = scored()[0];
  document.querySelectorAll("#gmap .gchip, #gmap .gmark[data-id]").forEach(el =>
    el.classList.toggle("pick", !!top && el.dataset.id === top.r.id));
  gmDraw();
}
function wireMap(){
  const gm = document.getElementById("gmap"), svg = gm.querySelector(".gmcanvas svg");
  if (!svg) return;
  const choose = id => { mapSel = id; mapNbSel = null; gmDraw(); };
  svg.addEventListener("click", e => {
    const nb = e.target.closest("[data-nbk]");
    if (nb){ mapNbSel = nb.dataset.nbk; gmDraw(); return; }
    const el = e.target.closest("[data-id]"); if (el) choose(el.dataset.id);
  });
  svg.querySelectorAll(".gchip").forEach(g => g.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " "){ e.preventDefault(); choose(g.dataset.id); }
  }));
  gmDraw();
  // 좁은 화면에서는 지도를 가로로 밀어 보게 되니, 지금 보여 주는 식당을 가운데로
  // 건물 검색이면 그 건물이 지도 한가운데, 아니면 지금 보여 주는 식당이 가운데.
  const cv = gm.querySelector(".gmcanvas");
  if (cv.scrollWidth > cv.clientWidth + 4){
    if (mapNear) cv.scrollLeft = (cv.scrollWidth - cv.clientWidth) / 2;
    else {
      const c = svg.querySelector(".gchip.on rect");
      if (c){
        const b = c.getBoundingClientRect(), cb = cv.getBoundingClientRect();
        cv.scrollLeft += (b.left + b.width / 2) - (cb.left + cb.width / 2);
      }
    }
  }
  if (mapJustFocused){
    mapJustFocused = false;
    const y = gm.getBoundingClientRect().top;
    if (y < 80 || y > innerHeight * .5) window.scrollTo({ top: y + scrollY - 96, behavior: "smooth" });
  }
}

// ── 식당 카드 ─────────────────────────────────────────────────
function cardHtml(r, score, isTop, near){
  const t = T[lang];
  const mains = r.items.filter(i => i.main), sides = r.items.filter(i => !i.main);
  const bd = lang === "ko" ? r.boardDate : (r.boardDateEn || r.boardDate);
  const badges = [];
  if (isTop && !near) badges.push(`<span class="badge rank">${esc(t.topBadge)}</span>`);
  if (near && r.lat != null) badges.push(`<span class="badge dist">${esc(t.nearTag(Math.round(gmDist(r, near) / 10) * 10, walkFrom(r, near)))}</span>`);
  if (r.pick) badges.push(`<span class="badge ed">${esc(t.edPick(r.pick))}</span>`);
  if (bd) badges.push(`<span class="badge warn">${esc(t.offdate(bd))}</span>`);
  const img = r.img ? `<img src="${esc(r.img)}" alt="${esc(t.boardAlt(nm(r)))}" loading="lazy" referrerpolicy="no-referrer"
      onerror="this.parentNode.classList.add('noimg');this.remove()">` : "";
  const art = `<span class="art" aria-hidden="true"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30"></circle>
      <use href="#i-${dishFamily(r)}" x="12" y="12" width="40" height="40"></use></svg></span>`;
  const mainTxt = mains.slice(0, 3).map(i => lang === "ko" ? i.ko : i.en).join(" · ") + (mains.length > 3 ? t.etc(mains.length - 3) : "");
  const sideTxt = sides.map(i => lang === "ko" ? i.ko : i.en).join(" · ");
  const place = [shortAddr(r.address), !near && nearOrigin && r.lat != null ? t.walkFrom(walkFrom(r, nearOrigin)) : ""].filter(Boolean).join(" · ");
  const stat = r.stats ? t.dishes(r.stats.count) + (r.stats.wonPerItem ? " · " + t.perItem(r.stats.wonPerItem) : "") : "";
  const hours = lang === "ko" ? r.hoursKo : r.hoursEn, tip = lang === "ko" ? r.tipKo : r.tipEn;
  const more = [hours ? `<p>🕐 ${esc(hours)}</p>` : "", tip ? `<p>${esc(tip)}</p>` : "",
    mains.length ? `<p>${mains.map(i => esc(lang === "ko" ? `${i.ko} — ${i.en}` : `${i.en} — ${i.ko}`)).join("<br>")}</p>` : ""].join("");
  return `<article class="card${r.items.length ? "" : " dim"}" data-id="${esc(r.id)}">
    <div class="cbody">
      <div class="chead"><div class="ctitle">
        ${badges.length ? `<div class="cbadges">${badges.join("")}</div>` : ""}
        <h3 class="cname">${esc(nm(r))}</h3>
        ${place ? `<div class="cplace">${esc(place)}</div>` : ""}</div>${score != null
        ? `<span class="cscore${isTop ? " top" : ""}">${score.toFixed(1)}<small>${esc(t.cardScore)}</small></span>`
        : `<span class="cscore na">${esc(t.nearNoScore)}</span>`}</div>
      ${nowHtml(r)}
      <div class="cmid">
        <button type="button" class="cthumb${r.img ? "" : " noimg"}" data-img="${esc(r.img || "")}"
          aria-label="${esc(r.img ? t.zoom : t.shot)}" title="${esc(r.img ? t.zoom : "")}"${r.img ? "" : " disabled"}>
          ${img}${art}${r.img ? `<span class="zoom"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10.4 10.4 14 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>` : ""}</button>
        <div class="cmenu">
          ${mainTxt ? `<div class="cmains">${esc(mainTxt)}</div>` : `<div class="cnone">${esc(r.manual ? t.noMenu : (r.notes || t.noItems))}</div>`}
          ${sideTxt ? `<div class="csides">${esc(sideTxt)}</div>` : ""}</div>
      </div>
      ${bd ? `<div class="cwarn">${t.offdateNote(esc(bd))}</div>` : ""}
      ${more ? `<details class="cmore" data-id="${esc(r.id)}"${open.has(r.id) ? " open" : ""}><summary>${esc(t.more)}</summary>${more}</details>` : ""}
      <div class="cfoot"><span class="cprice${r.price ? "" : " na"}">${esc(r.price ? won(r.price) : t.noPrice)}</span>
        ${stat ? `<span class="cstat">${esc(stat)}</span>` : ""}
        ${ateBtnHtml("c", r.id, "c:" + r.id)}
        ${r.directions ? `<a class="cdir" href="${esc(r.directions)}" target="_blank" rel="noopener">${esc(t.directions)} ↗</a>` : ""}</div>
    </div></article>`;
}
function wireCards(){
  document.querySelectorAll(".card .cthumb").forEach(b => {
    if (!b.dataset.img) return;
    b.onclick = () => { lbImg.src = b.dataset.img; lbImg.alt = b.querySelector("img")?.alt || ""; lb.showModal(); };
  });
  document.querySelectorAll("details.cmore").forEach(d =>
    d.addEventListener("toggle", () => { d.open ? open.add(d.dataset.id) : open.delete(d.dataset.id); }));
}
function goCard(id){
  const c = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
  if (!c) return;
  c.scrollIntoView({ behavior: "smooth", block: "center" });
  c.classList.remove("flash"); void c.offsetWidth; c.classList.add("flash");
}

// ── 화면 ──────────────────────────────────────────────────────
let mapOn = false;          // 지도 버튼. 건물 검색 때는 이와 상관없이 지도를 띄운다
try { mapOn = localStorage.getItem("glb-map") === "1"; } catch(e) {}
const cur = { term: "", nterm: "", near: null, matchR: () => true };

// ── 근처 일반식당 (서울시 인허가 공공데이터) ──────────────────────
// build.py 가 한 곳을 [이름, 업종 번호, 동쪽 m, 북쪽 m] 로 줄여 싣는다. 같은 GM_MX·GM_MY 로 되돌린다.
const NB = (() => {
  const d = DATA.nearby; if (!d) return [];
  return d.p.map(([n, g, dx, dy], i) => ({ id: "nb" + i, n, g: d.g[g], lat: d.o.lat + dy / GM_MY, lng: d.o.lng + dx / GM_MX }));
})();
const NB_MIN = [5, 10, 15];
let nbMin = 10, nbGroup = "", nbShow = 40, kindF = "all";
try {
  const m = +localStorage.getItem("glb-nbmin"); if (NB_MIN.includes(m)) nbMin = m;
  const k = localStorage.getItem("glb-kind"); if (["all", "caf", "near"].includes(k)) kindF = k;
} catch(e) {}
// "도보 N분" 은 카드의 도보 시간(walkFrom)과 같은 셈 — 직선거리 × 1.3 ÷ 분당 75m — 이라야 목록과 어긋나지 않는다
const nbRadiusM = () => nbMin * 75 / 1.3;
const nbOrigin = () => cur.near || cur.nbBld || nearOrigin || (DATA.nearby && DATA.nearby.o);
const grpName = g => lang === "ko" ? g : (T.en.groups[g] || g);
function nbBase(){
  const o = nbOrigin(); if (!o) return [];
  const R = nbRadiusM();
  let xs = NB.map(p => ({ p, d: gmDist(p, o) })).filter(x => x.d <= R);
  // 건물 검색이 아닌 검색어는 가게 이름·업종에서도 찾는다
  if (cur.nterm && !cur.near && !cur.nbBld) xs = xs.filter(x => normQ(x.p.n + x.p.g + (T.en.groups[x.p.g] || "")).includes(cur.nterm));
  return xs.sort((a, b) => a.d - b.d);
}
function nbList(){ const b = nbBase(); return nbGroup ? b.filter(x => x.p.g === nbGroup) : b; }
// 카카오맵 공개 링크 형식(지도에 이름과 위치를 찍어 보여 줌). API 호출·저장 없음.
const kakaoLink = p => `https://map.kakao.com/link/map/${encodeURIComponent(p.n.replace(/,/g, " "))},${p.lat.toFixed(6)},${p.lng.toFixed(6)}`;
function nbHtml(){
  const t = T[lang], o = nbOrigin();
  if (!NB.length || !o) return "";
  const base = nbBase(), cnt = {};
  for (const x of base) cnt[x.p.g] = (cnt[x.p.g] || 0) + 1;
  if (nbGroup && !cnt[nbGroup]) nbGroup = "";
  const list = nbGroup ? base.filter(x => x.p.g === nbGroup) : base;
  const groups = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]);
  const seg = NB_MIN.map(m => `<button type="button" data-min="${m}" aria-pressed="${m === nbMin}">${esc(t.nbMin(m))}</button>`).join("");
  const chips = [`<button type="button" class="nbc" data-g="" aria-pressed="${!nbGroup}">${esc(t.nbAll)}<b>${base.length}</b></button>`,
    ...groups.map(g => `<button type="button" class="nbc" data-g="${esc(g)}" aria-pressed="${g === nbGroup}">${esc(grpName(g))}<b>${cnt[g]}</b></button>`)].join("");
  const rows = list.slice(0, nbShow).map(({ p, d }) => `<li class="nbrow"><div class="nbi"><span class="nbn">${esc(p.n)}</span>
      <span class="nbm"><i class="nbg">${esc(grpName(p.g))}</i>${d < 30 ? esc(t.nbSame) : `${esc(t.walkFrom(walkFrom(p, o)))} · ${Math.round(d / 10) * 10}m`}</span></div>
      ${ateBtnHtml("n", p.n, "n:" + p.id)}<a class="nbk" href="${kakaoLink(p)}" target="_blank" rel="noopener">${esc(t.nbKakao)} ↗</a></li>`).join("");
  const left = list.length - nbShow;
  const more = left > 0 ? `<button type="button" class="nbmore" id="nbMore">${esc(t.nbMore(Math.min(40, left), left))}</button>` : "";
  return `<div class="nbbox" id="nbBox"><div class="sechead"><h2>${esc(t.nbTitle(o.n))}</h2><span class="sub">${esc(t.nbSub)}</span></div>
    <div class="nbtools"><div class="seg" role="group" aria-label="${esc(t.nbRadius)}">${seg}</div><div class="nbchips">${chips}</div></div>${nbRecentHtml()}
    ${list.length ? `<ul class="nblist">${rows}</ul>${more}` : `<p class="empty">${esc(t.nbNone)}</p>`}
    <p class="nbnote">${esc(t.nbNote)}</p></div>`;
}
function nbRecentHtml(){
  const t = T[lang], since = dayShift(kstToday(), -6), c = {};
  for (const e of lunchLog) if (e.d >= since) c[e.g] = (c[e.g] || 0) + 1;
  const parts = Object.entries(c).sort((a, b) => b[1] - a[1]).map(([g, n]) => `<b>${esc(grpName(g))} ${n}</b>`);
  return parts.length ? `<p class="nbrecent">${esc(t.nbRecent)}: ${parts.join(" · ")} — ${esc(t.nbRecentHint)}</p>` : "";
}
function wireNb(){
  const box = document.getElementById("nbBox"); if (!box) return;
  box.querySelectorAll("[data-min]").forEach(b => b.onclick = () => {
    nbMin = +b.dataset.min; nbShow = 40;
    try { localStorage.setItem("glb-nbmin", String(nbMin)); } catch(e) {}
    renderGrid();
  });
  box.querySelectorAll(".nbc").forEach(b => b.onclick = () => { nbGroup = b.dataset.g; nbShow = 40; renderGrid(); });
  const m = document.getElementById("nbMore");
  if (m) m.onclick = () => { nbShow += 40; renderGrid(true); };
}
function kindSegHtml(){
  const t = T[lang];
  return ["all", "caf", "near"].map(k => `<button type="button" data-kind="${k}" aria-pressed="${k === kindF}">${esc(t.kind[k])}</button>`).join("");
}

function orderedList(){
  const list = DATA.restaurants.filter(r => !cur.nterm || cur.near || cur.matchR(r));
  if (cur.near) return [...list].sort((a, b) => (a.lat == null) - (b.lat == null) || gmDist(a, cur.near) - gmDist(b, cur.near)).slice(0, NEAR_N);
  // 오늘 점수 높은 순. 점수가 없는 곳(메뉴 미게시)은 뒤로.
  const sc = scoreMap();
  // 오늘 배식이 끝난 곳(시간이 적힌 곳만)은 뒤로
  return [...list].sort((a, b) => isDone(a) - isDone(b) || (sc[b.id] ?? -1) - (sc[a.id] ?? -1));
}

function renderGrid(skipMap){
  const t = T[lang], near = cur.near, all = orderedList();
  const showCaf = kindF !== "near", showNb = kindF !== "caf" && NB.length > 0;
  const list = showCaf ? all : [];
  const sc = scoreMap(), topId = scored()[0]?.r.id;
  const nbN = showNb ? nbList().length : 0;
  document.getElementById("count").textContent = t.count(list.length + nbN);
  const head = near ? t.nearTitle(near.n, list.length) : cur.term ? t.searchTitle(list.length) : t.gridTitle;
  const sub = near ? t.nearSub : t.gridSub;
  document.getElementById("gridBox").innerHTML = (showCaf ? `<div class="sechead"><h2>${esc(head)}</h2><span class="sub">${esc(sub)}</span></div>
    <div class="grid">${list.map(r => cardHtml(r, sc[r.id], r.id === topId, near)).join("") || `<p class="empty">${esc(t.empty)}</p>`}</div>` : "")
    + (showNb ? nbHtml() : "");
  wireCards();
  wireNb();
  if (skipMap) return;
  const gm = document.getElementById("gmap");
  const show = !!near || mapOn;
  document.getElementById("mapBtn").setAttribute("aria-pressed", show);
  // 일반식당만 볼 때도 지도에는 구내식당을 함께 둔다(길 찾는 기준점)
  const html = show ? mapHtml(all.map((r, i) => ({ r, idx: i + 1 })), near) : "";
  gm.innerHTML = html;
  gm.hidden = !html;
  if (html) wireMap();
}

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById("siteTitle").textContent = t.siteTitle;
  document.getElementById("siteSib").textContent = t.siteSib;
  const N = DATA.todayNumbers || {};
  document.getElementById("stamp").textContent =
    [lang === "ko" ? DATA.dateKo : DATA.dateEn, N.places ? t.statPlaces(N.places) : ""].filter(Boolean).join(" · ");
  const q = document.getElementById("q");
  q.placeholder = t.search;
  document.getElementById("qLabel").textContent = t.search;
  document.getElementById("mapBtnT").textContent = t.mapBtn;
  document.getElementById("primerSum").textContent = t.primerSum;
  document.getElementById("primerBody").innerHTML = t.primer.map(x => `<p>${x}</p>`).join("");
  document.getElementById("photoNote").textContent = t.photoNote;
  document.getElementById("foot1").textContent = t.foot1;
  document.getElementById("foot2").textContent = t.foot2(DATA.builtAt);
  document.getElementById("foot3").innerHTML = DATA.nearby
    ? `${esc(t.nbAttr)} · <a href="${esc(DATA.nearby.url || "https://data.seoul.go.kr")}" target="_blank" rel="noopener">data.seoul.go.kr</a>` : "";
  const ks = document.getElementById("kindSeg");
  ks.hidden = !NB.length;
  ks.setAttribute("aria-label", t.kindLabel);
  ks.innerHTML = kindSegHtml();
  ks.querySelectorAll("button").forEach(b => b.onclick = () => {
    kindF = b.dataset.kind;
    try { localStorage.setItem("glb-kind", kindF); } catch(e) {}
    render();
  });
  document.getElementById("btnKo").setAttribute("aria-pressed", lang === "ko");
  document.getElementById("btnEn").setAttribute("aria-pressed", lang === "en");
  const age = boardAgeDays();
  // 날짜를 못 읽은 경우(age === null)에는 예전처럼 빌드 시점 판정으로 물러선다.
  const isOld = age === null ? DATA.sourceIsOld : age > 0;
  document.getElementById("banner").innerHTML = isOld
    ? `<div class="banner">${t.oldWarn(esc(DATA.sourceDate), age)}</div>` : "";

  cur.term = q.value.trim().toLowerCase();
  cur.nterm = normQ(cur.term);
  cur.matchR = r => normQ([r.ko, r.en, r.address || "", ...r.items.map(i => i.ko + " " + i.en)].join(" ")).includes(cur.nterm);
  // 식당 이름·주소·메뉴에 하나도 안 걸리면 건물 이름으로 보고, 그 건물에서 가까운 순으로 보여 준다.
  cur.near = cur.nterm && !DATA.restaurants.some(cur.matchR) ? findBuilding(cur.nterm) : null;
  // 검색한 건물이 가까움 점수의 기준이 된다. 기억해 두었다가 첫 화면 추천에도 쓴다.
  if (cur.near && (!nearOrigin || nearOrigin.n !== cur.near.n)){ nearOrigin = cur.near; saveOrigin(); }
  // 근처 일반식당: 가게 이름·업종에 안 걸리는 검색어는 건물 이름으로 보고 그 건물을 기준으로 삼는다.
  // (구내식당 주소에 걸려 위의 건물 검색이 안 된 경우 — 예: '대륭포스트타워5차' — 도 여기서 잡힌다)
  cur.nbBld = null;
  if (cur.nterm && !cur.near && NB.length && !NB.some(p => normQ(p.n + p.g + (T.en.groups[p.g] || "")).includes(cur.nterm)))
    cur.nbBld = findBuilding(cur.nterm);

  const pb = document.getElementById("picksBox");
  const hidePicks = !!cur.term || kindF === "near";
  pb.hidden = hidePicks;
  if (hidePicks) pb.innerHTML = ""; else renderPicks();
  renderLedger();
  renderGrid();
}

document.getElementById("mapBtn").onclick = () => {
  mapOn = !mapOn;
  try { localStorage.setItem("glb-map", mapOn ? "1" : "0"); } catch(e) {}
  render();
  if (mapOn && !cur.near) document.getElementById("gmap").scrollIntoView({ behavior: "smooth", block: "start" });
};

document.getElementById("btnKo").onclick = () => { lang = "ko"; save(); render(); };
document.getElementById("btnEn").onclick = () => { lang = "en"; save(); render(); };
document.getElementById("q").addEventListener("input", render);
// 배식 남은 시간·복귀 시각은 시계를 따라 바뀐다. 화면이 보일 때만 1분마다 다시 그린다.
setInterval(() => { if (!document.hidden) refreshScores(); }, 60000);
// "먹었어요" — 구내식당 카드·근처 목록 어디서 눌러도 여기서 받는다
document.addEventListener("click", e => {
  const b = e.target.closest("[data-ate]"); if (!b) return;
  const k = b.dataset.ate.slice(0, 1), key = b.dataset.ate.slice(2);
  if (k === "c"){
    const r = DATA.restaurants.find(x => x.id === key);
    if (r) markAte({ k, id: r.id, n: r.ko, g: "구내식당", p: r.price || null });
  } else {
    const q = NB.find(x => x.id === key);
    if (q) markAte({ k, id: q.n, n: q.n, g: q.g, p: null });
  }
  renderLedger();
  refreshScores();
});

function save(){ try { localStorage.setItem("glb-lang", lang); } catch(e) {} }
try { const s = localStorage.getItem("glb-lang"); if (s === "ko" || s === "en") lang = s; } catch(e) {}
if (lang === "ko" && !navigator.language.toLowerCase().startsWith("ko")) {
  try { if (!localStorage.getItem("glb-lang")) lang = "en"; } catch(e) { lang = "en"; }
}

render();
</script>
</body>
</html>
