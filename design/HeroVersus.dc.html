<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;900&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans KR", "Malgun Gothic", sans-serif; }
    a { color: #1B4DD8; } a:hover { color: #143AA6; }
  </style>
</helmet>
<div style="width: 900px; background: #E8E9EC; padding: 22px; box-sizing: border-box">

  <div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .18em; color: #8B929C; margin-bottom: 10px">E · 대결 · 1위 vs 2위</div>

  <div style="background: #FDFDFD; border: 1px solid #C9CDD4; border-radius: 10px; overflow: hidden">

    <div style="display: grid; grid-template-columns: 1fr 92px 1fr; align-items: stretch">
      <div style="padding: 20px 22px; display: flex; align-items: center; gap: 14px; background: #EAF1FB">
        <img src="jeyuk.jpg" style="width: 62px; height: 62px; border-radius: 8px; object-fit: cover; border: 1px solid #C9CDD4" alt="">
        <div>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 700; letter-spacing: .14em; color: #1B4DD8">1위</div>
          <div style="font-family: 'Gothic A1', sans-serif; font-weight: 900; font-size: 22px; margin-top: 2px">바른식탁</div>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #5B626D; margin-top: 3px">8,000원 · 12찬</div>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; background: #191C21; color: #fff">
        <div style="font-family: 'Gothic A1', sans-serif; font-weight: 900; font-size: 19px">72.8</div>
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .1em; color: rgba(255,255,255,.5); padding: 3px 0">vs</div>
        <div style="font-family: 'Gothic A1', sans-serif; font-weight: 900; font-size: 19px; color: rgba(255,255,255,.6)">71.2</div>
      </div>
      <div style="padding: 20px 22px; display: flex; align-items: center; gap: 14px; justify-content: flex-end; text-align: right">
        <div>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 700; letter-spacing: .14em; color: #8B929C">2위</div>
          <div style="font-family: 'Gothic A1', sans-serif; font-weight: 900; font-size: 22px; margin-top: 2px">미가푸드빌 에이스8차</div>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #5B626D; margin-top: 3px">가격 미확인 · 12찬</div>
        </div>
        <img src="donkatsu.jpg" style="width: 62px; height: 62px; border-radius: 8px; object-fit: cover; border: 1px solid #C9CDD4" alt="">
      </div>
    </div>

    <div style="border-top: 1px solid #E4E6EA; padding: 16px 22px; display: flex; flex-direction: column; gap: 9px">
      <div style="display: grid; grid-template-columns: 1fr 76px 1fr; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px">
        <div style="display: flex; align-items: center; gap: 8px; justify-content: flex-end">
          <b style="color: #1B4DD8">91</b>
          <span style="flex: 1; max-width: 150px; height: 6px; background: #E4E6EA; border-radius: 99px; overflow: hidden; display: flex; justify-content: flex-end">
            <span style="width: 91%; background: #1B4DD8; border-radius: 99px"></span></span>
        </div>
        <div style="text-align: center; color: #8B929C; font-size: 10px; letter-spacing: .06em">가성비</div>
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="flex: 1; max-width: 150px; height: 6px; background: #E4E6EA; border-radius: 99px; overflow: hidden; display: flex">
            <span style="width: 50%; background: #C9CDD4; border-radius: 99px"></span></span>
          <span style="color: #8B929C">50</span>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 76px 1fr; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px">
        <div style="display: flex; align-items: center; gap: 8px; justify-content: flex-end">
          <b style="color: #1B4DD8">90</b>
          <span style="flex: 1; max-width: 150px; height: 6px; background: #E4E6EA; border-radius: 99px; overflow: hidden; display: flex; justify-content: flex-end">
            <span style="width: 90%; background: #1B4DD8; border-radius: 99px"></span></span>
        </div>
        <div style="text-align: center; color: #8B929C; font-size: 10px; letter-spacing: .06em">반찬수</div>
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="flex: 1; max-width: 150px; height: 6px; background: #E4E6EA; border-radius: 99px; overflow: hidden; display: flex">
            <span style="width: 90%; background: #C9CDD4; border-radius: 99px"></span></span>
          <span style="color: #5B626D">90</span>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 76px 1fr; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px">
        <div style="display: flex; align-items: center; gap: 8px; justify-content: flex-end">
          <span style="color: #5B626D">67</span>
          <span style="flex: 1; max-width: 150px; height: 6px; background: #E4E6EA; border-radius: 99px; overflow: hidden; display: flex; justify-content: flex-end">
            <span style="width: 67%; background: #C9CDD4; border-radius: 99px"></span></span>
        </div>
        <div style="text-align: center; color: #8B929C; font-size: 10px; letter-spacing: .06em">메인수</div>
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="flex: 1; max-width: 150px; height: 6px; background: #E4E6EA; border-radius: 99px; overflow: hidden; display: flex">
            <span style="width: 100%; background: #C82A19; border-radius: 99px"></span></span>
          <b style="color: #C82A19">100</b>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 76px 1fr; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px">
        <div style="display: flex; align-items: center; gap: 8px; justify-content: flex-end">
          <span style="color: #5B626D">75</span>
          <span style="flex: 1; max-width: 150px; height: 6px; background: #E4E6EA; border-radius: 99px; overflow: hidden; display: flex; justify-content: flex-end">
            <span style="width: 75%; background: #C9CDD4; border-radius: 99px"></span></span>
        </div>
        <div style="text-align: center; color: #8B929C; font-size: 10px; letter-spacing: .06em">단백질</div>
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="flex: 1; max-width: 150px; height: 6px; background: #E4E6EA; border-radius: 99px; overflow: hidden; display: flex">
            <span style="width: 100%; background: #C82A19; border-radius: 99px"></span></span>
          <b style="color: #C82A19">100</b>
        </div>
      </div>
    </div>

    <div style="border-top: 1px solid #E4E6EA; background: #F2F3F5; padding: 12px 22px; font-size: 12.5px; color: #5B626D">
      <b style="color: #191C21">싸게 많이 먹으려면 왼쪽, 고기를 원하면 오른쪽.</b> 가중치를 '고기 우선'으로 바꾸면 순위가 뒤집힙니다.
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
