<!doctype html>
<html>
<head>

  <script src="./support.js"></script>
</head>
<body>
<x-dc>

  <style>

      </div>
    </div>

  <div style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 12px">
    <div style="background: #FDFDFD; border: 1px solid #C9CDD4; border-radius: 7px; padding: 9px 10px">

      <div style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px; color: #1B4DD8">91</div>
    </div>

      <div style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px; color: #1B4DD8">90</div>

      <div style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px">50</div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
