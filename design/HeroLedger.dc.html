<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;900&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans KR", "Malgun Gothic", sans-serif; }
    a { color: #1B4DD8; } a:hover { color: #143AA6; }
  </style>
</helmet>
<div style="width: 900px; background: #E8E9EC; padding: 22px; box-sizing: border-box">

  <div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .18em; color: #8B929C; margin-bottom: 10px">C · 장부 · 계산이 보인다</div>

  <div style="background: #FDFDFD; border: 1px solid #C9CDD4; border-radius: 10px; display: grid; grid-template-columns: minmax(0,1fr) 330px; overflow: hidden">

    <div style="padding: 24px 26px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; align-items: flex-start; justify-content: space-between; border-bottom: 2px solid #191C21; padding-bottom: 12px">
        <div>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .16em; color: #1B4DD8; margin-bottom: 6px">오늘의 추천</div>
          <div style="font-family: 'Gothic A1', sans-serif; font-weight: 900; font-size: 30px; letter-spacing: -.02em">바른식탁</div>
          <div style="font-size: 14px; color: #5B626D; margin-top: 4px">직화제육볶음 · 수제순살치킨 외 1</div>
        </div>
        <img src="jeyuk.jpg" style="width: 84px; height: 84px; border-radius: 8px; object-fit: cover; border: 1px solid #C9CDD4" alt="">
      </div>

      <div style="font-family: 'JetBrains Mono', monospace; font-size: 12.5px">
        <div style="display: flex; justify-content: space-between; color: #8B929C; font-size: 10px; letter-spacing: .1em; padding-bottom: 6px; border-bottom: 1px solid #E4E6EA">
          <span>항 목</span><span>점수 × 가중치 = 기여</span>
        </div>
        <div style="display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dotted #E4E6EA">
          <span>가성비</span><span><span style="color: #8B929C">91 × 3 =</span> <b style="color: #1B4DD8">2.73</b></span></div>
        <div style="display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dotted #E4E6EA">
          <span>반찬수</span><span><span style="color: #8B929C">90 × 3 =</span> <b style="color: #1B4DD8">2.70</b></span></div>
        <div style="display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dotted #E4E6EA">
          <span>메인수</span><span><span style="color: #8B929C">67 × 3 =</span> <b>2.01</b></span></div>
        <div style="display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dotted #E4E6EA">
          <span>단백질</span><span><span style="color: #8B929C">75 × 2 =</span> <b>1.50</b></span></div>
        <div style="display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dotted #E4E6EA">
          <span>희소성</span><span><span style="color: #8B929C">50 × 2 =</span> <b>1.00</b></span></div>
        <div style="display: flex; justify-content: space-between; padding: 6px 0; color: #8B929C">
          <span>가까움 <span style="font-size: 9px; background: #FBF0DC; color: #8A5A00; border-radius: 3px; padding: 1px 4px">정보없음</span></span>
          <span>50 × 2 = <b>1.00</b></span></div>
        <div style="display: flex; justify-content: space-between; padding: 10px 0 0; border-top: 2px solid #191C21; margin-top: 6px; font-size: 15px">
          <span style="font-weight: 700">합계 ÷ 가중치 15</span>
          <span style="font-family: 'Gothic A1', sans-serif; font-weight: 900; font-size: 22px; color: #1B4DD8">72.8</span></div>
      </div>
    </div>

    <div style="background: #F2F3F5; border-left: 1px solid #E4E6EA; padding: 24px 22px; display: flex; flex-direction: column; gap: 14px">
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #8B929C">다음 순위</div>
      <div style="display: flex; justify-content: space-between; font-size: 13px; padding-bottom: 8px; border-bottom: 1px dotted #D8DBE1">
        <span>미가푸드빌 에이스8차</span><span style="font-family: 'JetBrains Mono', monospace; color: #5B626D">71.2</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 13px; padding-bottom: 8px; border-bottom: 1px dotted #D8DBE1">
        <span>더소울푸드</span><span style="font-family: 'JetBrains Mono', monospace; color: #5B626D">69.4</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 13px">
        <span>마이푸드</span><span style="font-family: 'JetBrains Mono', monospace; color: #5B626D">68.1</span></div>
      <div style="margin-top: auto; background: #FDFDFD; border: 1px solid #D8DBE1; border-radius: 7px; padding: 11px 13px; font-size: 12px; color: #5B626D; line-height: 1.55">
        <b style="color: #191C21">1.6점 차</b>입니다. 가중치를 바꾸면 순위가 뒤집힐 수 있습니다.
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
