<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가산 런치보드 — 오늘의 구내식당 메뉴</title>
<meta name="description" content="서울 가산디지털단지 구내식당의 오늘 메뉴를 한국어와 영어로. Today's cafeteria menus in Seoul's Gasan Digital Complex, in Korean and English.">
<meta property="og:title" content="가산 런치보드 / Gasan Lunch Board">
<meta property="og:description" content="가산디지털단지 구내식당 오늘의 메뉴 · Today's office-cafeteria menus, with English">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Gothic+A1:wght@500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --ground:#E8E9EC; --tray:#FDFDFD; --tray-edge:#C9CDD4; --tray-inset:#F2F3F5; --row-alt:#F7F8FA;
  --ink:#191C21; --ink-2:#5B626D; --ink-3:#8B929C;
  --accent:#1B4DD8; --accent-wash:#E7EDFD;
  --heat:#C82A19; --heat-wash:#FBE9E6;
  --rule:#D8DBE1; --pick:#0B7A55; --pick-wash:#E3F3EC;
  --warn:#8A5A00; --warn-wash:#FBF0DC;
  --shadow:0 1px 0 #FFF inset, 0 1px 2px rgba(16,20,28,.07), 0 8px 20px -12px rgba(16,20,28,.30);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#14171C; --tray:#1D2126; --tray-edge:#2E343C; --tray-inset:#252A31; --row-alt:#20242A;
  --ink:#EDEFF2; --ink-2:#A2AAB5; --ink-3:#767E89;
  --accent:#7BA0FF; --accent-wash:#1E2A45;
  --heat:#FF8A72; --heat-wash:#3A211B;
  --rule:#2E343C; --pick:#4FC79A; --pick-wash:#17322A;
  --warn:#E8B75E; --warn-wash:#332812;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 2px 4px rgba(0,0,0,.4), 0 10px 24px -14px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --ground:#14171C; --tray:#1D2126; --tray-edge:#2E343C; --tray-inset:#252A31; --row-alt:#20242A;
  --ink:#EDEFF2; --ink-2:#A2AAB5; --ink-3:#767E89;
  --accent:#7BA0FF; --accent-wash:#1E2A45;
  --heat:#FF8A72; --heat-wash:#3A211B;
  --rule:#2E343C; --pick:#4FC79A; --pick-wash:#17322A;
  --warn:#E8B75E; --warn-wash:#332812;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 2px 4px rgba(0,0,0,.4), 0 10px 24px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.5;
  padding:0 16px 72px}
.wrap{max-width:1180px;margin:0 auto}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

header{padding:34px 0 18px;border-bottom:2px solid var(--ink)}
.topline{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{margin:0;font-family:"Gothic A1","Archivo",sans-serif;font-weight:900;
  font-size:clamp(26px,4.4vw,38px);letter-spacing:-.02em;line-height:1.02;text-wrap:balance}
h1 .en{display:block;font-family:"Archivo",sans-serif;font-weight:700;font-size:.42em;
  letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);margin-top:7px}
.stamp{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;letter-spacing:.08em;
  color:var(--accent);border:1.5px solid var(--accent);border-radius:3px;padding:5px 9px;white-space:nowrap}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 0 20px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
.seg button{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:12.5px;letter-spacing:.08em;
  background:transparent;color:var(--ink);border:0;padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.seg button+button{border-left:1.5px solid var(--ink)}
input[type=search]{flex:1;min-width:180px;background:var(--tray);border:1.5px solid var(--tray-edge);
  border-radius:4px;padding:9px 12px;color:var(--ink);font:inherit;font-size:14px}
input[type=search]::placeholder{color:var(--ink-3)}
.count{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink-3);letter-spacing:.06em}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.banner{background:var(--warn-wash);border-left:4px solid var(--warn);border-radius:0 6px 6px 0;
  padding:12px 16px;margin-bottom:18px;font-size:14px;color:var(--warn)}

.rec{background:var(--tray);border:1px solid var(--tray-edge);border-radius:10px;box-shadow:var(--shadow);
  margin-bottom:16px;overflow:hidden}
.rechead{display:flex;align-items:center;gap:10px;padding:11px 18px;background:var(--ink);color:var(--ground)}
.rechead .t{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;letter-spacing:.14em}
.rechead .d{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:11px;opacity:.7}
.recbody{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
@media (max-width:820px){.recbody{grid-template-columns:1fr}}
.recL{padding:18px;display:flex;flex-direction:column;gap:14px;border-right:1px solid var(--rule)}
.recR{padding:18px;display:flex;flex-direction:column;gap:13px;background:var(--tray-inset)}
@media (max-width:820px){.recL{border-right:0;border-bottom:1px solid var(--rule)}}

.recwho{display:flex;align-items:center;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:13px}
.recwho img{width:76px;height:76px;border-radius:9px;object-fit:cover;border:1px solid var(--tray-edge);flex-shrink:0}
.recname{font-family:"Gothic A1",sans-serif;font-weight:900;font-size:24px;line-height:1.1;letter-spacing:-.02em}
.recdish{font-size:13.5px;color:var(--ink-2);margin-top:4px}
.recmeta{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--ink-3);margin-top:4px}
.recbig{margin-left:auto;text-align:right;flex-shrink:0}
.recbig .n{font-family:"Gothic A1",sans-serif;font-weight:900;font-size:30px;color:var(--accent);line-height:1}
.recbig .u{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.14em;color:var(--ink-3)}

.ledger{font-family:"JetBrains Mono",monospace;font-size:12px}
.lghead{display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.1em;color:var(--ink-3);
  padding-bottom:5px;border-bottom:1px solid var(--rule)}
.lgrow{display:grid;grid-template-columns:1fr auto 54px;gap:10px;align-items:baseline;padding:5.5px 0;
  border-bottom:1px dotted var(--rule)}
.lgrow.zero{opacity:.42}
.lgname{color:var(--ink)}
.lgcalc{color:var(--ink-3);font-size:11px;white-space:nowrap}
.lgc{text-align:right;font-weight:700}
.lgtot{display:grid;grid-template-columns:1fr auto 54px;gap:10px;align-items:baseline;padding:9px 0 0;
  border-top:2px solid var(--ink);margin-top:4px}
.lgtot .lgc{font-family:"Gothic A1",sans-serif;font-size:19px;color:var(--accent)}
.nabadge{font-size:8.5px;font-weight:700;color:var(--warn);background:var(--warn-wash);border-radius:3px;
  padding:1px 4px;margin-left:4px;letter-spacing:0}

.vshead{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:"JetBrains Mono",monospace;
  font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--ink-3)}
.vshead b{color:var(--ink-2);font-weight:700;font-size:11.5px;letter-spacing:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.vsrow{display:grid;grid-template-columns:1fr 58px 1fr;gap:7px;align-items:center;
  font-family:"JetBrains Mono",monospace;font-size:10.5px;padding:3px 0}
.vsL,.vsR{display:flex;align-items:center;gap:6px;min-width:0}
.vsL{justify-content:flex-end}
.vstrack{flex:1;height:6px;background:var(--tray-edge);border-radius:99px;overflow:hidden;display:flex;min-width:0}
.vsL .vstrack{justify-content:flex-end}
.vsfill{background:var(--ink-3);border-radius:99px}
.vsfill.win{background:var(--accent)}
.vsfill.win2{background:var(--heat)}
.vsn{width:22px;flex-shrink:0}
.vsL .vsn{text-align:left}
.vsR .vsn{text-align:right}
.vsname{text-align:center;font-size:9.5px;color:var(--ink-3);letter-spacing:.04em}
.vsrow.na{opacity:.45}
.vsna{font-size:9.5px;color:var(--ink-3)}
.vsnote{font-size:11.5px;color:var(--ink-2);background:var(--tray);border:1px solid var(--rule);
  border-radius:6px;padding:8px 10px;line-height:1.5}
.vsnote b{color:var(--ink)}

.presets{display:flex;gap:5px;flex-wrap:wrap}
.presets button{font-family:"JetBrains Mono",monospace;font-size:10.5px;font-weight:700;letter-spacing:.03em;
  background:var(--tray);color:var(--ink-2);border:1px solid var(--tray-edge);border-radius:99px;
  padding:4px 10px;cursor:pointer}
.presets button:hover{border-color:var(--accent);color:var(--accent)}
.presets button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
details.wt{border-top:1px solid var(--rule);padding-top:9px}
details.wt summary{cursor:pointer;font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:700;
  letter-spacing:.12em;color:var(--ink-3);list-style:none}
details.wt summary::-webkit-details-marker{display:none}
details.wt summary::after{content:" ▾"}
details.wt[open] summary::after{content:" ▴"}
.wrow{display:grid;grid-template-columns:76px 1fr 20px;align-items:center;gap:7px;margin-top:7px}
.wrow label{color:var(--ink-2);font-size:11px;display:flex;align-items:center;gap:3px}
.wrow input[type=range]{width:100%;accent-color:var(--accent);height:16px}
.wrow .wv{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--ink-3);text-align:right}
.cov{font-family:"JetBrains Mono",monospace;font-size:8.5px;color:var(--warn);background:var(--warn-wash);
  border-radius:3px;padding:1px 3px;cursor:help}
.ate{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:11px;color:var(--ink-3);
  border-top:1px solid var(--rule);padding-top:9px;margin-top:auto}
.ate button{font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:700;background:var(--tray);
  border:1px solid var(--tray-edge);border-radius:4px;padding:4px 8px;cursor:pointer;color:var(--ink)}
.ate button:hover{border-color:var(--accent);color:var(--accent)}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-bottom:14px}
.hcard{background:var(--tray);border:1px solid var(--tray-edge);border-radius:10px;box-shadow:var(--shadow);
  padding:16px 18px;display:flex;flex-direction:column;gap:9px;border-top:4px solid var(--accent)}
.hcard.heat{border-top-color:var(--heat)}
.hcard.pick{border-top-color:var(--pick)}
.hcard .hlbl{font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--accent)}
.hcard.heat .hlbl{color:var(--heat)}
.hcard.pick .hlbl{color:var(--pick)}
.hcard .hbody{display:flex;align-items:center;gap:13px}
.hcard img{width:68px;height:68px;border-radius:8px;object-fit:cover;border:1px solid var(--tray-edge);flex-shrink:0}
.hcard .hname{font-family:"Gothic A1",sans-serif;font-weight:900;font-size:18px;line-height:1.15}
.hcard .hnum{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:14px;color:var(--accent);margin-top:2px}
.hcard.heat .hnum{color:var(--heat)}
.hcard.pick .hnum{color:var(--pick)}
.hcard .hsub{font-size:12.5px;color:var(--ink-2)}
.statline{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--ink-3);letter-spacing:.03em;
  margin-bottom:18px;display:flex;gap:14px;flex-wrap:wrap}
.statline b{color:var(--ink-2);font-weight:700}

.list{background:var(--tray);border:1px solid var(--tray-edge);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.lhead{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1.5px solid var(--ink);background:var(--tray-inset)}
.lhead .t{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--ink-2)}
.lhead .h{margin-left:auto;font-size:12px;color:var(--ink-3)}
details.lrow{border-bottom:1px dashed var(--rule)}
details.lrow:last-child{border-bottom:none}
details.lrow:nth-child(even){background:var(--row-alt)}
details.lrow.dim summary{opacity:.6}
summary.lsum{display:flex;align-items:center;gap:13px;padding:12px 18px;cursor:pointer;list-style:none}
summary.lsum::-webkit-details-marker{display:none}
summary.lsum:hover{background:var(--accent-wash)}
.lidx{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:12px;color:var(--ink-3);width:18px;flex-shrink:0}
.lwho{width:172px;flex-shrink:0;display:flex;flex-direction:column}
.lwho .n{font-weight:700;font-size:14.5px;line-height:1.25}
.lwho .b{font-size:11px;color:var(--ink-3)}
.lpic{width:42px;height:42px;border-radius:6px;object-fit:cover;border:1px solid var(--tray-edge);flex-shrink:0;background:var(--tray-inset)}
.lmain{flex:1;min-width:0;display:flex;flex-direction:column}
.lmain .m{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lmain .s{font-size:11.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnum{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-2);width:104px;text-align:right;flex-shrink:0}
.lwon{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:13.5px;width:52px;text-align:right;flex-shrink:0}
.ltag{font-family:"JetBrains Mono",monospace;font-size:9.5px;font-weight:700;letter-spacing:.05em;
  border-radius:3px;padding:2px 5px;white-space:nowrap}
.ltag.pick{background:var(--pick-wash);color:var(--pick)}
.ltag.warn{background:var(--warn-wash);color:var(--warn)}
.ltag.stale{background:var(--tray-inset);color:var(--ink-3)}

.ldetail{padding:4px 18px 18px 49px;display:flex;flex-direction:column;gap:13px}
.where{font-size:13px;color:var(--ink-2)}
.where a{color:var(--accent);text-decoration:none;font-weight:600;white-space:nowrap}
.where a:hover{text-decoration:underline}
.lbl{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.mains{display:flex;flex-direction:column;border-top:1.5px solid var(--ink)}
.mains .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dotted var(--rule)}
.dpic{width:48px;height:48px;flex-shrink:0;border-radius:6px;object-fit:cover;
  border:1px solid var(--tray-edge);background:var(--tray-inset)}
.mains .dish{font-weight:700;font-size:14.5px}
.mains .sec2{font-size:12px;color:var(--ink-2)}
.hot{font-size:10px;font-weight:700;font-family:"JetBrains Mono",monospace;color:var(--heat);
  background:var(--heat-wash);border-radius:3px;padding:2px 5px;letter-spacing:.05em;white-space:nowrap;margin-left:auto}
.sides{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:5px}
.sides li{font-size:12px;color:var(--ink-2);background:var(--tray-inset);border-radius:3px;padding:3px 8px}
.note{font-size:12.5px;color:var(--ink-2);background:var(--tray-inset);border-radius:5px;padding:9px 11px}
.shotbtn{display:inline-flex;align-items:center;gap:6px;font-family:"JetBrains Mono",monospace;font-size:11px;
  font-weight:700;letter-spacing:.06em;color:var(--accent);background:none;border:1.5px solid var(--accent);
  border-radius:4px;padding:6px 12px;cursor:pointer;align-self:flex-start}
.shotbtn:hover{background:var(--accent-wash)}

details.primer{background:var(--accent-wash);border-left:4px solid var(--accent);border-radius:0 6px 6px 0;
  padding:13px 17px;margin-top:22px}
details.primer summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--accent)}
details.primer p{margin:11px 0 0;font-size:13.5px;color:var(--ink-2);max-width:70ch}

dialog{border:0;padding:0;background:transparent;max-width:min(94vw,760px);max-height:92vh}
dialog::backdrop{background:rgba(10,12,16,.86)}
dialog img{width:100%;height:auto;display:block;border-radius:8px;background:#fff}
dialog .close{position:sticky;top:0;margin-left:auto;display:block;background:var(--ink);color:var(--ground);
  border:0;border-radius:4px;padding:7px 12px;font-family:"JetBrains Mono",monospace;font-size:12px;
  font-weight:700;cursor:pointer;margin-bottom:8px}

footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--rule);color:var(--ink-3);font-size:12.5px;
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:720px){
  .lwho{width:118px}
  .lnum{display:none}
  .lmain .s{display:none}
  .ldetail{padding-left:18px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="topline">
    <h1>가산 런치보드<span class="en">Gasan Lunch Board</span></h1>
    <div class="stamp mono" id="stamp"></div>
  </div>
</header>

<div class="bar">
  <div class="seg" role="group" aria-label="language">
    <button id="btnKo" aria-pressed="true">한국어</button>
    <button id="btnEn" aria-pressed="false">ENGLISH</button>
  </div>
  <input type="search" id="q" autocomplete="off">
  <span class="count mono" id="count"></span>
</div>

<div id="banner"></div>
<div class="rec" id="rec"></div>
<div class="hero" id="hero"></div>
<div class="statline" id="statline"></div>
<div class="list" id="list"></div>

<details class="primer">
  <summary id="primerSum"></summary>
  <div id="primerBody"></div>
</details>

<footer>
  <span id="photoNote" style="flex-basis:100%"></span>
  <span id="foot1"></span>
  <span id="foot2"></span>
</footer>
</div>

<dialog id="lb"><button class="close" id="lbClose">ESC ✕</button><img id="lbImg" alt=""></dialog>

<script>
const DATA = __PAYLOAD__;
let lang = "ko";
const open = new Set();

const T = {
  ko:{
    search:"메뉴·식당·건물 검색 (예: 치킨, 제육, 대륭)",
    count:n=>`${n}곳`,
    recTitle:"오늘의 추천",
    lgItem:"항 목", lgCalc:"점수 × 가중치 = 기여", lgTotal:"합계",
    vsNote:(n,g)=>`2위 <b>${n}</b>보다 <b>${g}점</b> 앞섭니다. 파란 쪽이 이긴 항목입니다.`,
    axes:{value:"가성비",variety:"반찬수",mains:"메인수",protein:"단백질",rarity:"희소성",near:"가까움"},
    axisHelp:{value:"품목당 단가가 쌀수록",variety:"나오는 가짓수가 많을수록",mains:"메인 요리가 많을수록",
      protein:"단백질 종류가 다양할수록",rarity:"다른 곳에 없는 메뉴일수록",near:"사무실에서 가까울수록"},
    covHelp:"이 축의 값을 아는 식당 수 / 전체. 모르는 곳은 중립으로 계산됩니다.",
    weights:"내 기준", presets:{balanced:"균형",cheap:"가성비 우선",meat:"고기 우선",lazy:"가까운 곳"},
    score:s=>`${s}점`, gap:(n,d)=>`2위 ${n}보다 ${d}점 앞섬`, onlyOne:"오늘 비교 가능한 곳이 하나뿐입니다",

const firstDishImg = r => {
  for (const i of r.items) if (i.main && i.dish && DATA.dishImages[i.dish]) return DATA.dishImages[i.dish].thumb;
  for (const i of r.items) if (i.dish && DATA.dishImages[i.dish]) return DATA.dishImages[i.dish].thumb;

};

// ---- 추천 ----
// 축별 원점수(0~1)는 빌드 때 계산해 두고, 가중치는 보는 사람이 정한다.
// 모르는 값(가격 미확인 등)은 0.5로 두어 그 식당이 손해도 이득도 보지 않게 한다.
const AXES = ["value","variety","mains","protein","rarity","near"];
const PRESETS = {
  balanced:{value:3,variety:3,mains:3,protein:2,rarity:2,near:2},
  cheap:   {value:5,variety:4,mains:2,protein:1,rarity:1,near:2},
  meat:    {value:1,variety:2,mains:5,protein:5,rarity:2,near:1},
  lazy:    {value:2,variety:2,mains:2,protein:1,rarity:1,near:5},
};
let W = {...PRESETS.balanced};
let ate = [];   // 최근 먹은 식당 id, 최신순

try { const w = JSON.parse(localStorage.getItem("glb-w") || "null"); if (w) W = {...W, ...w}; } catch(e) {}
try { const a = JSON.parse(localStorage.getItem("glb-ate") || "null"); if (Array.isArray(a)) ate = a.slice(0, 5); } catch(e) {}
const keep = () => { try {
  localStorage.setItem("glb-w", JSON.stringify(W));
  localStorage.setItem("glb-ate", JSON.stringify(ate));
} catch(e) {} };

function scored(){
  const out = [];
  for (const r of DATA.restaurants){
    const ax = DATA.axes && DATA.axes[r.id];
    if (!ax) continue;                       // 오늘 메뉴가 제대로 올라온 곳만
    let sum = 0, wsum = 0;
    const parts = [];
    for (const a of AXES){
      const w = W[a] || 0;
      const v = ax[a];
      parts.push({ axis:a, value:v, weight:w });
      if (!w) continue;
      sum += (v === null ? 0.5 : v) * w;     // 정보 없으면 중립
      wsum += w;
    }
    let score = wsum ? sum / wsum : 0;
    // 최근에 간 곳은 낮춘다. 바로 어제 갔으면 많이, 닷새 전이면 조금.
    const seen = ate.indexOf(r.id);
    const penalty = seen === -1 ? 0 : 0.28 / (seen + 1);
    score = Math.max(0, score - penalty);
    out.push({ r, ax, parts, score: Math.round(score * 1000) / 10, penalty });
  }
  out.sort((a,b) => b.score - a.score);
  return out;
}

// 축마다 값을 아는 곳이 몇 곳인지. 데이터가 얇은 축에 가중치를 크게 주면
// 순위가 아니라 결측을 반영하게 되므로, 그 사실을 화면에 드러낸다.
function coverage(){
  const ids = Object.keys(DATA.axes || {});
  const c = {};
  for (const a of AXES) c[a] = ids.filter(id => DATA.axes[id][a] !== null).length;
  c._total = ids.length;
  return c;
}

function recHtml(){
  const t = T[lang];
  const list = scored();
  if (!list.length) return "";
  const top = list[0], second = list[1];
  const W_SUM = AXES.reduce((a, x) => a + (W[x] || 0), 0);

  // 장부: 각 축의 기여도를 합하면 정확히 총점이 되도록 나눈다.
  const rows = top.parts.map(pt => {
    const v = pt.value === null ? 0.5 : pt.value;
    const contrib = W_SUM ? (v * pt.weight / W_SUM) * 100 : 0;
    return { ...pt, shown: Math.round(v * 100), contrib };
  });

  const img = firstDishImg(top.r);
  const mains = top.r.items.filter(i => i.main).slice(0, 2)
    .map(i => lang === "ko" ? i.ko : i.en).join(" · ");
  const st = top.r.stats || {};
  const meta = [
    top.r.price ? top.r.price.toLocaleString() + (lang === "ko" ? "원" : " KRW") : null,
    st.count ? t.dishes(st.count) : null,
    st.wonPerItem ? t.perItem(st.wonPerItem) : null,
    top.r.walkMin ? (lang === "ko" ? `도보 ${top.r.walkMin}분` : `${top.r.walkMin} min`) : null,
  ].filter(Boolean).join(" · ");

  const ledger = `<div class="ledger">
    <div class="lghead"><span>${esc(t.lgItem)}</span><span>${esc(t.lgCalc)}</span></div>
    ${rows.map(r => `<div class="lgrow${r.weight ? "" : " zero"}">
      <span class="lgname">${esc(t.axes[r.axis])}${r.value === null ? `<span class="nabadge">${esc(t.na)}</span>` : ""}</span>
      <span class="lgcalc">${r.shown} × ${r.weight}</span>
      <span class="lgc">${r.contrib.toFixed(1)}</span></div>`).join("")}
    <div class="lgtot">
      <span class="lgname" style="font-weight:700">${esc(t.lgTotal)}</span>
      <span class="lgcalc">÷ ${W_SUM}</span>
      <span class="lgc">${top.score.toFixed(1)}</span></div>
  </div>`;

  // 대결: 1위와 2위를 축별로 마주 세운다.
  let versus;
  if (second){
    const gap = Math.round((top.score - second.score) * 10) / 10;
    versus = `<div class="vshead"><span>1</span><b>${esc(nm(top.r))}</b>
        <span style="color:var(--ink-3)">vs</span><b style="text-align:right">${esc(nm(second.r))}</b><span>2</span></div>
      ${AXES.map(a => {
        // 양쪽 다 값을 모르면 무승부가 아니라 비교 불가다. 막대를 그리지 않는다.
        if (top.ax[a] === null && second.ax[a] === null){
          return `<div class="vsrow na"><span></span>
            <span class="vsname">${esc(t.axes[a])}</span>
            <span class="vsna">${esc(t.na)}</span></div>`;
        }
        const l = top.ax[a] === null ? 0.5 : top.ax[a];
        const r = second.ax[a] === null ? 0.5 : second.ax[a];
        const lw = l > r + 0.02, rw = r > l + 0.02;
        return `<div class="vsrow">
          <span class="vsL"><span class="vsn">${Math.round(l * 100)}</span>
            <span class="vstrack"><span class="vsfill${lw ? " win" : ""}" style="width:${Math.round(l * 100)}%"></span></span></span>
          <span class="vsname">${esc(t.axes[a])}</span>
          <span class="vsR"><span class="vstrack"><span class="vsfill${rw ? " win2" : ""}" style="width:${Math.round(r * 100)}%"></span></span>
            <span class="vsn">${Math.round(r * 100)}</span></span></div>`;
      }).join("")}
      <div class="vsnote">${t.vsNote(esc(nm(second.r)), gap)}</div>`;
  } else {
    versus = `<div class="vsnote">${esc(t.onlyOne)}</div>`;
  }

  const cov = coverage();
  const sliders = AXES.map(a => {
    const thin = cov[a] < cov._total;
    return `<div class="wrow">
      <label for="w-${a}">${esc(t.axes[a])}${thin ? `<span class="cov" title="${esc(t.covHelp)}">${cov[a]}/${cov._total}</span>` : ""}</label>
      <input type="range" id="w-${a}" data-axis="${a}" min="0" max="5" step="1" value="${W[a]}" aria-label="${esc(t.axes[a])}">
      <span class="wv">${W[a]}</span></div>`;
  }).join("");

  const activePreset = Object.keys(PRESETS).find(k =>
    AXES.every(a => PRESETS[k][a] === W[a]));

  return `<div class="rechead"><span class="t">${esc(t.recTitle)}</span>
      <span class="d">${esc(lang === "ko" ? DATA.dateKo : DATA.dateEn)}</span></div>
    <div class="recbody">
      <div class="recL">
        <div class="recwho">
          ${img ? `<img src="${esc(img)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
          <div style="min-width:0">
            <div class="recname">${esc(nm(top.r))}</div>
            ${mains ? `<div class="recdish">${esc(mains)}</div>` : ""}
            <div class="recmeta">${esc(meta)}</div>
          </div>
          <div class="recbig"><div class="n">${top.score.toFixed(1)}</div><div class="u">SCORE</div></div>
        </div>
        ${ledger}
      </div>
      <div class="recR">
        ${versus}
        <div class="presets">${Object.keys(PRESETS).map(k =>
          `<button data-preset="${k}" aria-pressed="${activePreset === k}">${esc(t.presets[k])}</button>`).join("")}</div>
        <details class="wt"><summary>${esc(t.weights)}</summary>${sliders}</details>
        <div class="ate">
          <button id="ateBtn">${esc(t.ateBtn)}</button>
          ${ate.length ? `<span>${esc(t.ateNote(ate.length))}</span>
            <button id="ateClear">${esc(t.ateClear)}</button>` : ""}
        </div>
      </div>
    </div>`;
}

function wireRec(){
  const box = document.getElementById("rec");
  const redraw = () => {
    const openW = box.querySelector("details.wt")?.open;
    box.innerHTML = recHtml();
    if (openW){ const d = box.querySelector("details.wt"); if (d) d.open = true; }
    wireRec();
  };
  box.querySelectorAll('input[type=range]').forEach(inp => {
    inp.addEventListener("input", () => {
      W[inp.dataset.axis] = +inp.value;
      inp.nextElementSibling.textContent = inp.value;
      keep(); redraw();
    });
  });
  box.querySelectorAll("[data-preset]").forEach(b => {
    b.onclick = () => { W = {...PRESETS[b.dataset.preset]}; keep(); redraw(); };
  });
  const ab = document.getElementById("ateBtn");
  if (ab) ab.onclick = () => {
    const top = scored()[0];
    if (!top) return;
    ate = [top.r.id, ...ate.filter(x => x !== top.r.id)].slice(0, 5);
    keep(); redraw();
  };
  const ac = document.getElementById("ateClear");
  if (ac) ac.onclick = () => { ate = []; keep(); redraw(); };
}

        const di = i.dish && DATA.dishImages[i.dish];
        return `<div class="row">${di ? `<img class="dpic" src="${esc(di.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer"
          onerror="this.remove()" title="${esc((di.author ? di.author + " · " : "") + di.license + " · Wikimedia Commons")}">` : ""}
          <div><div class="dish">${esc(lang === "ko" ? i.ko : i.en)}</div>
          <div class="sec2">${esc(lang === "ko" ? i.en : i.ko)}</div></div>
          ${i.spicy ? `<span class="hot">${esc(t.spicy)}</span>` : ""}</div>`;
      }).join("")}</div></div>` : ""}
      ${sidesArr.length ? `<div><div class="lbl">${esc(t.sides)}</div><ul class="sides">${sidesArr.map(i => `<li>${esc(lang === "ko" ? i.ko : i.en)}</li>`).join("")}</ul></div>` : ""}
      ${tip ? `<div class="note">${esc(tip)}</div>` : ""}
      ${r.img ? `<button class="shotbtn" data-id="${esc(r.id)}">${esc(t.shot)}</button>` : ""}
    </div>`;

  return `<details class="lrow${r.items.length ? "" : " dim"}" data-id="${esc(r.id)}"${open.has(r.id) ? " open" : ""}>
    <summary class="lsum">
      <span class="lidx">${idx}</span>
      <span class="lwho"><span class="n">${esc(nm(r))}</span><span class="b">${esc(shortAddr(r.address) || (lang === "ko" ? r.en || "" : r.ko))}</span></span>
      ${thumb ? `<img class="lpic" src="${esc(thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : `<span class="lpic"></span>`}
      <span class="lmain"><span class="m">${esc(mainNames || (r.manual ? "—" : ""))}</span><span class="s">${esc(sideNames)}</span></span>
      ${tags.join("")}
      <span class="lnum">${r.stats ? esc(t.dishes(r.stats.count)) + (r.stats.wonPerItem ? " · " + esc(t.perItem(r.stats.wonPerItem)) : "") : ""}</span>
      <span class="lwon">${r.price ? r.price.toLocaleString() : ""}</span>
    </summary>
    ${detail}
  </details>`;
}

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById("stamp").textContent = lang === "ko" ? DATA.dateKo : DATA.dateEn;
  document.getElementById("q").placeholder = t.search;
  document.getElementById("primerSum").textContent = t.primerSum;
  document.getElementById("primerBody").innerHTML = t.primer.map(p => `<p>${p}</p>`).join("");
  document.getElementById("photoNote").textContent = t.photoNote;
  document.getElementById("foot1").textContent = t.foot1;
  document.getElementById("foot2").textContent = t.foot2(DATA.builtAt);
  document.getElementById("btnKo").setAttribute("aria-pressed", lang === "ko");
  document.getElementById("btnEn").setAttribute("aria-pressed", lang === "en");
  document.getElementById("banner").innerHTML = DATA.sourceIsOld
    ? `<div class="banner">${t.oldWarn(esc(DATA.sourceDate))}</div>` : "";

  const term = document.getElementById("q").value.trim().toLowerCase();
  const recBox = document.getElementById("rec");
  recBox.innerHTML = term ? "" : recHtml();
  recBox.style.display = term ? "none" : "";
  if (!term) wireRec();
  document.getElementById("hero").innerHTML = term ? "" : heroHtml();

  const N = DATA.todayNumbers || {};
  const stats = [];
  if (N.places) stats.push(`<b>${esc(t.statPlaces(N.places))}</b>`);
  if (N.avgItems) stats.push(esc(t.statAvg(N.avgItems)));
  if (N.overlap && N.overlap.length) stats.push(esc(t.statOverlap(N.overlap)));
  document.getElementById("statline").innerHTML = term ? "" : stats.join('<span style="color:var(--rule)">|</span>');

  let shown = 0, rows = "";
  DATA.restaurants.forEach(r => {
    const hay = [r.ko, r.en, r.address || "", ...r.items.map(i => i.ko + " " + i.en)].join(" ").toLowerCase();
    if (term && !hay.includes(term)) return;
    shown++;
    rows += rowHtml(r, shown);
  });
  document.getElementById("count").textContent = t.count(shown);
  document.getElementById("list").innerHTML =
    `<div class="lhead"><span class="t">${esc(t.listTitle)}</span><span class="h">${esc(t.listHint)}</span></div>` + rows;

  document.querySelectorAll("details.lrow").forEach(d => {
    d.addEventListener("toggle", () => { d.open ? open.add(d.dataset.id) : open.delete(d.dataset.id); });
  });
  document.querySelectorAll(".shotbtn").forEach(b => {
    b.onclick = (e) => {
      e.preventDefault();
      const r = DATA.restaurants.find(x => x.id === b.dataset.id);
      lbImg.src = r.img;
      lbImg.alt = nm(r) + " menu board";
      lb.showModal();
    };
  });
}

document.getElementById("btnKo").onclick = () => { lang = "ko"; save(); render(); };
document.getElementById("btnEn").onclick = () => { lang = "en"; save(); render(); };
document.getElementById("q").addEventListener("input", render);

function save(){ try { localStorage.setItem("glb-lang", lang); } catch(e) {} }
try { const s = localStorage.getItem("glb-lang"); if (s === "ko" || s === "en") lang = s; } catch(e) {}
if (lang === "ko" && !navigator.language.toLowerCase().startsWith("ko")) {
  try { if (!localStorage.getItem("glb-lang")) lang = "en"; } catch(e) { lang = "en"; }
}

render();
</script>
</body>
</html>
