name: 오늘의 메뉴 갱신

on:
  schedule:
    # 하루 한 번, 월~토 KST 10:00 (UTC 01:00). GitHub 예약 실행은 늦게 돌거나 건너뛸 수 있다 —
    # 그런 날은 Actions 에서 수동 실행(workflow_dispatch)으로 돌린다.
    - cron: "0 1 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: menu-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 메뉴판 수집
        run: python scripts/fetch.py

      - name: 메뉴판 판독
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/ocr.py

      - name: 페이지 생성
        run: python scripts/build.py

      - name: 오늘치 기록
        run: python scripts/archive.py

      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html data/sources.json data/history cache/ocr
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "메뉴 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi
